<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Seletivo — Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;
    --mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;
    --border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);
    --yellow:#F6C343;--red:#E55B5B;
  }
  html,body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased;min-height:100vh}

  /* ── HEADER ── */
  .hdr{height:68px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:10}
  .logo-area{display:flex;align-items:center;gap:12px}
  .logo-mark{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-mark svg{width:18px;height:18px}
  .logo-name{font-size:15px;font-weight:600}
  .logo-name span{color:var(--green)}
  .hdr-center{font-size:13px;color:var(--t2);text-align:center}
  .hdr-center strong{color:var(--white);display:block;font-size:14px}
  .hdr-right{display:flex;align-items:center;gap:10px}
  .btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
  .btn-s:hover{border-color:var(--t2);color:var(--white)}
  .btn-p{background:var(--green);color:var(--dark);border:none;border-radius:10px;padding:8px 18px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
  .btn-p:hover{opacity:.88}

  /* ── PAGE ── */
  .page{max-width:1100px;margin:0 auto;padding:40px 40px 80px}

  /* ── TOP ── */
  .top-bar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:32px;gap:16px;flex-wrap:wrap}
  .top-bar h1{font-size:26px;font-weight:600}
  .top-bar p{font-size:14px;color:var(--t2);margin-top:4px}
  .top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

  /* ── STATS ── */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
  .stat-label{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .stat-value{font-size:26px;font-weight:700;line-height:1}
  .stat-sub{font-size:12px;color:var(--t2);margin-top:5px}

  /* ── FILTROS ── */
  .filtros{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
  .filtro-label{font-size:12px;color:var(--t2)}
  .filtro-btn{background:transparent;border:1px solid var(--border);border-radius:8px;padding:6px 14px;font-size:12px;color:var(--mist);font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
  .filtro-btn:hover{border-color:var(--border2);color:var(--white)}
  .filtro-btn.active{background:rgba(147,245,116,0.1);border-color:var(--border2);color:var(--green)}
  .search-wrap{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:7px 12px;margin-left:auto}
  .search-wrap input{background:transparent;border:none;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;width:180px}
  .search-wrap input::placeholder{color:var(--t1)}

  /* ── TABELA ── */
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:700px}
  thead tr{border-bottom:1px solid var(--border)}
  th{padding:12px 16px;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;font-weight:600;text-align:left;white-space:nowrap;cursor:pointer;user-select:none;transition:color .15s}
  th:hover{color:var(--mist)}
  th.sorted{color:var(--green)}
  th .sort-icon{margin-left:4px;opacity:.5}
  th.sorted .sort-icon{opacity:1}
  tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:rgba(147,245,116,0.03)}
  td{padding:14px 16px;font-size:13px;vertical-align:middle}

  /* ── POSIÇÃO ── */
  .pos{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
  .pos-1{background:rgba(255,215,0,0.15);color:#FFD700;border:1px solid rgba(255,215,0,0.3)}
  .pos-2{background:rgba(192,192,192,0.15);color:#C0C0C0;border:1px solid rgba(192,192,192,0.3)}
  .pos-3{background:rgba(205,127,50,0.15);color:#CD7F32;border:1px solid rgba(205,127,50,0.3)}
  .pos-n{background:rgba(255,255,255,0.05);color:var(--t2);border:1px solid var(--border)}

  /* ── CANDIDATO CELL ── */
  .cand-cell{display:flex;flex-direction:column;gap:2px}
  .cand-cell-name{font-weight:500;color:var(--white)}
  .cand-cell-email{font-size:11px;color:var(--t2)}

  /* ── NOTA BADGE ── */
  .nota{display:inline-flex;align-items:center;justify-content:center;width:32px;height:24px;border-radius:6px;font-size:12px;font-weight:600}
  .nota-0{background:rgba(255,255,255,0.04);color:var(--t1)}
  .nota-1{background:rgba(229,91,91,0.12);color:#E55B5B}
  .nota-2{background:rgba(246,195,67,0.12);color:#F6C343}
  .nota-3{background:rgba(103,138,136,0.18);color:var(--mist)}
  .nota-4{background:rgba(100,200,150,0.12);color:#64C896}
  .nota-5{background:rgba(147,245,116,0.12);color:var(--green)}

  /* ── MÉDIA ── */
  .media-cell{display:flex;align-items:center;gap:8px}
  .media-num{font-size:16px;font-weight:700}
  .media-bar-wrap{flex:1;height:4px;background:rgba(255,255,255,0.06);border-radius:2px;min-width:40px}
  .media-bar{height:4px;border-radius:2px;background:var(--green);transition:width .3s}

  /* ── STATUS ── */
  .status-aval{font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(147,245,116,0.1);color:var(--green);border:1px solid var(--border2)}
  .status-pend{font-size:11px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,0.04);color:var(--t2);border:1px solid var(--border)}

  /* ── BTN AVALIAR ── */
  .btn-row{background:transparent;border:1px solid var(--border);border-radius:7px;padding:5px 12px;font-size:12px;color:var(--mist);font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
  .btn-row:hover{border-color:var(--border2);color:var(--white)}

  /* ── EMPTY ── */
  .empty-row td{text-align:center;padding:56px;color:var(--t2);font-size:14px}

  /* ── LOADING ── */
  .loading-wrap{padding:56px;text-align:center;color:var(--t2)}
  .loading-dots{display:inline-flex;gap:6px;margin-top:12px}
  .loading-dots span{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s ease-in-out infinite}
  .loading-dots span:nth-child(2){animation-delay:.2s}
  .loading-dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}

  @media(max-width:640px){
    .hdr,.page{padding-left:20px;padding-right:20px}
    .stats{grid-template-columns:1fr 1fr}
    .hdr-center{display:none}
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo-area">
    <div class="logo-mark">
      <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="#002726" opacity=".4"/></svg>
    </div>
    <span class="logo-name">Bling <span>Seletivo</span></span>
  </div>
  <div class="hdr-center">
    <strong id="hdr-titulo">Ranking</strong>
    <span id="hdr-sub">carregando…</span>
  </div>
  <div class="hdr-right">
    <button class="btn-s" onclick="window.location.href='avaliar.html?p='+processId">← Avaliação</button>
    <button class="btn-s" onclick="window.location.href='painel.html'">Painel</button>
    <button class="btn-p" onclick="exportarCSV()">⬇ Exportar CSV</button>
  </div>
</header>

<!-- PAGE -->
<div class="page">

  <div class="top-bar">
    <div>
      <h1>Ranking de candidatos</h1>
      <p id="processo-sub">carregando…</p>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat">
      <div class="stat-label">Candidatos</div>
      <div class="stat-value" id="st-total">—</div>
      <div class="stat-sub">enviaram respostas</div>
    </div>
    <div class="stat">
      <div class="stat-label">Avaliados</div>
      <div class="stat-value" id="st-aval" style="color:var(--green)">—</div>
      <div class="stat-sub">com nota registrada</div>
    </div>
    <div class="stat">
      <div class="stat-label">Maior nota</div>
      <div class="stat-value" id="st-max" style="color:var(--green)">—</div>
      <div class="stat-sub">média mais alta</div>
    </div>
    <div class="stat">
      <div class="stat-label">Média geral</div>
      <div class="stat-value" id="st-media">—</div>
      <div class="stat-sub">todos os avaliados</div>
    </div>
  </div>

  <!-- FILTROS -->
  <div class="filtros">
    <span class="filtro-label">Filtrar:</span>
    <button class="filtro-btn active" onclick="setFiltro('todos',this)">Todos</button>
    <button class="filtro-btn" onclick="setFiltro('avaliados',this)">Avaliados</button>
    <button class="filtro-btn" onclick="setFiltro('pendentes',this)">Pendentes</button>
    <div class="search-wrap">
      <span style="color:var(--t2);font-size:13px">🔍</span>
      <input type="text" placeholder="Buscar candidato…" oninput="buscar(this.value)">
    </div>
  </div>

  <!-- TABELA -->
  <div class="table-wrap" id="table-wrap">
    <div class="loading-wrap">
      Carregando ranking
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxWXwMe3rE1zMSiIxmz5E34cc2BmyeGsw",
    authDomain: "bling-seletivo.firebaseapp.com",
    projectId: "bling-seletivo",
    storageBucket: "bling-seletivo.firebasestorage.app",
    messagingSenderId: "680949628238",
    appId: "1:680949628238:web:6e74791e02b69a1333321f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.processId = new URLSearchParams(window.location.search).get('p');
  let processo = null;
  let dados = []; // candidatos + avaliações merged
  let filtroAtual = 'todos';
  let buscaAtual = '';
  let ordenacao = { campo: 'total', dir: 'desc' };

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    if (!window.processId) { window.location.href = 'painel.html'; return; }
    await carregarDados();
  });

  async function carregarDados() {
    try {
      const pSnap = await getDoc(doc(db, 'processes', window.processId));
      if (!pSnap.exists()) { window.location.href = 'painel.html'; return; }
      processo = { id: pSnap.id, ...pSnap.data() };

      document.getElementById('hdr-titulo').textContent = processo.title;
      document.getElementById('hdr-sub').textContent = `${processo.role} · ${processo.area}`;
      document.getElementById('processo-sub').textContent = `${processo.role} · ${processo.area}`;

      const [subSnap, evalSnap] = await Promise.all([
        getDocs(collection(db, 'processes', window.processId, 'submissions')),
        getDocs(collection(db, 'processes', window.processId, 'evaluations')),
      ]);

      const avaliacoes = {};
      evalSnap.forEach(d => avaliacoes[d.id] = d.data());

      dados = [];
      subSnap.forEach(d => {
        const sub = { id: d.id, ...d.data() };
        const aval = avaliacoes[d.id] || null;
        dados.push({ ...sub, avaliacao: aval, total: aval?.total || null });
      });

      atualizarStats();
      renderTabela();
    } catch(e) {
      document.getElementById('table-wrap').innerHTML = `<div class="loading-wrap" style="color:var(--red)">Erro: ${e.message}</div>`;
    }
  }

  function atualizarStats() {
    const avaliados = dados.filter(d => d.total !== null);
    document.getElementById('st-total').textContent = dados.length;
    document.getElementById('st-aval').textContent = avaliados.length;
    if (avaliados.length > 0) {
      const max = Math.max(...avaliados.map(d => d.total));
      const media = avaliados.reduce((a, b) => a + b.total, 0) / avaliados.length;
      document.getElementById('st-max').textContent = max.toFixed(1);
      document.getElementById('st-media').textContent = media.toFixed(1);
    } else {
      document.getElementById('st-max').textContent = '—';
      document.getElementById('st-media').textContent = '—';
    }
  }

  function dadosFiltrados() {
    let lista = [...dados];
    if (filtroAtual === 'avaliados') lista = lista.filter(d => d.total !== null);
    if (filtroAtual === 'pendentes') lista = lista.filter(d => d.total === null);
    if (buscaAtual) {
      const t = buscaAtual.toLowerCase();
      lista = lista.filter(d => d.name?.toLowerCase().includes(t) || d.email?.toLowerCase().includes(t));
    }
    // Ordena
    lista.sort((a, b) => {
      let va = a[ordenacao.campo] ?? -1;
      let vb = b[ordenacao.campo] ?? -1;
      if (typeof va === 'string') va = va.toLowerCase();
      if (typeof vb === 'string') vb = vb.toLowerCase();
      if (va < vb) return ordenacao.dir === 'asc' ? -1 : 1;
      if (va > vb) return ordenacao.dir === 'asc' ? 1 : -1;
      return 0;
    });
    return lista;
  }

  function renderTabela() {
    const lista = dadosFiltrados();
    const avaliados = dados.filter(d => d.total !== null);
    const maxTotal = avaliados.length > 0 ? Math.max(...avaliados.map(d => d.total)) : 5;
    const nCenarios = processo?.scenarios?.length || 0;

    const thSort = (campo, label) => {
      const ativo = ordenacao.campo === campo;
      const icon = ativo ? (ordenacao.dir === 'asc' ? '↑' : '↓') : '↕';
      return `<th class="${ativo ? 'sorted' : ''}" onclick="ordenarPor('${campo}')">${label} <span class="sort-icon">${icon}</span></th>`;
    };

    let html = `<table>
      <thead><tr>
        <th style="width:48px">#</th>
        ${thSort('name','Candidato')}
        ${processo?.scenarios?.map((s,i) => `<th style="text-align:center">C${i+1}<br><span style="font-size:10px;font-weight:400;color:var(--t2)">${esc(s.title?.substring(0,12))}…</span></th>`).join('') || ''}
        ${thSort('total','Média')}
        <th>Status</th>
        <th></th>
      </tr></thead>
      <tbody>`;

    if (lista.length === 0) {
      html += `<tr class="empty-row"><td colspan="${4 + nCenarios}">Nenhum candidato encontrado.</td></tr>`;
    } else {
      // Ranking real (só avaliados)
      const avaliadosOrdenados = dados.filter(d => d.total !== null).sort((a,b) => b.total - a.total);
      const posMap = {};
      avaliadosOrdenados.forEach((d, i) => posMap[d.id] = i + 1);

      lista.forEach(c => {
        const pos = posMap[c.id] || null;
        const posClass = pos === 1 ? 'pos-1' : pos === 2 ? 'pos-2' : pos === 3 ? 'pos-3' : 'pos-n';
        const posLabel = pos || '—';
        const submittedAt = c.submittedAt
          ? new Date(c.submittedAt.seconds * 1000).toLocaleDateString('pt-BR')
          : '—';

        // Notas por cenário
        const notasCenario = processo?.scenarios?.map((s, si) => {
          if (!c.avaliacao?.scores) return `<td style="text-align:center"><span class="nota nota-0">—</span></td>`;
          const notasSc = c.avaliacao.scores.filter(sc => sc.si === si);
          if (notasSc.length === 0) return `<td style="text-align:center"><span class="nota nota-0">—</span></td>`;
          const media = notasSc.reduce((a, b) => a + b.score, 0) / notasSc.length;
          const n = Math.round(media);
          return `<td style="text-align:center"><span class="nota nota-${n}">${media.toFixed(1)}</span></td>`;
        }).join('') || '';

        const mediaBar = c.total !== null
          ? `<div class="media-cell">
               <span class="media-num" style="color:${c.total >= 4 ? 'var(--green)' : c.total >= 3 ? 'var(--mist)' : 'var(--yellow)'}">${c.total.toFixed(1)}</span>
               <div class="media-bar-wrap"><div class="media-bar" style="width:${(c.total/5)*100}%"></div></div>
             </div>`
          : '<span style="color:var(--t2);font-size:13px">—</span>';

        html += `<tr>
          <td><div class="pos ${posClass}">${posLabel}</div></td>
          <td>
            <div class="cand-cell">
              <span class="cand-cell-name">${esc(c.name)}</span>
              <span class="cand-cell-email">${esc(c.email)} · ${submittedAt}</span>
            </div>
          </td>
          ${notasCenario}
          <td>${mediaBar}</td>
          <td>${c.avaliacao ? '<span class="status-aval">✓ Avaliado</span>' : '<span class="status-pend">Pendente</span>'}</td>
          <td><button class="btn-row" onclick="window.location.href='avaliar.html?p=${window.processId}'">Avaliar →</button></td>
        </tr>`;
      });
    }

    html += `</tbody></table>`;
    document.getElementById('table-wrap').innerHTML = html;
  }

  window.ordenarPor = function(campo) {
    if (ordenacao.campo === campo) {
      ordenacao.dir = ordenacao.dir === 'asc' ? 'desc' : 'asc';
    } else {
      ordenacao.campo = campo;
      ordenacao.dir = 'desc';
    }
    renderTabela();
  };

  window.setFiltro = function(filtro, btn) {
    filtroAtual = filtro;
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderTabela();
  };

  window.buscar = function(termo) {
    buscaAtual = termo;
    renderTabela();
  };

  // ── EXPORTAR CSV ──
  window.exportarCSV = function() {
    if (!processo || dados.length === 0) { alert('Nenhum dado para exportar.'); return; }

    const headers = ['Posição','Nome','E-mail','Data de envio','Tempo'];
    processo.scenarios.forEach((s, i) => headers.push(`Cenário ${i+1} — ${s.title}`));
    headers.push('Média geral','Status');

    const avaliados = dados.filter(d => d.total !== null).sort((a,b) => b.total - a.total);
    const posMap = {};
    avaliados.forEach((d, i) => posMap[d.id] = i + 1);

    const linhas = dados
      .sort((a, b) => (b.total || -1) - (a.total || -1))
      .map(c => {
        const pos = posMap[c.id] || '—';
        const data = c.submittedAt ? new Date(c.submittedAt.seconds * 1000).toLocaleDateString('pt-BR') : '—';
        const tempo = c.timeUsed ? formatarTempo(c.timeUsed) : '—';
        const notasCenario = processo.scenarios.map((s, si) => {
          if (!c.avaliacao?.scores) return '—';
          const notas = c.avaliacao.scores.filter(sc => sc.si === si);
          if (notas.length === 0) return '—';
          return (notas.reduce((a,b) => a + b.score, 0) / notas.length).toFixed(1);
        });
        const media = c.total !== null ? c.total.toFixed(1) : '—';
        const status = c.avaliacao ? 'Avaliado' : 'Pendente';
        return [pos, c.name, c.email, data, tempo, ...notasCenario, media, status];
      });

    const csv = [headers, ...linhas]
      .map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(','))
      .join('\n');

    const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ranking-${processo.title.replace(/\s+/g,'-').toLowerCase()}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  function formatarTempo(secs) {
    const h = Math.floor(secs / 3600), m = Math.floor((secs % 3600) / 60);
    return h > 0 ? `${h}h ${m}min` : `${m} min`;
  }

  function esc(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>
