<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Seletivo — Ranking</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;
    --mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;
    --border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);
    --yellow:#F6C343;--red:#E55B5B;
  }
  html,body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased;min-height:100vh}

  /* HEADER */
  .hdr{height:68px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:10}
  .logo-area{display:flex;align-items:center;gap:12px}
  .logo-mark{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-mark svg{width:18px;height:18px}
  .logo-name{font-size:15px;font-weight:600}
  .logo-name span{color:var(--green)}
  .hdr-center{font-size:13px;color:var(--t2);text-align:center}
  .hdr-center strong{color:var(--white);display:block;font-size:14px}
  .hdr-right{display:flex;gap:10px}
  .btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
  .btn-s:hover{border-color:var(--t2);color:var(--white)}
  .btn-p{background:var(--green);color:var(--dark);border:none;border-radius:10px;padding:8px 18px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
  .btn-p:hover{opacity:.88}

  /* PAGE */
  .page{max-width:1200px;margin:0 auto;padding:40px 40px 80px}

  /* TOP */
  .top-bar{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px;gap:16px;flex-wrap:wrap}
  .top-bar h1{font-size:26px;font-weight:600}
  .top-bar p{font-size:14px;color:var(--t2);margin-top:4px}
  .top-actions{display:flex;gap:10px;flex-wrap:wrap}

  /* STATS */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:32px}
  .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
  .stat-label{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
  .stat-value{font-size:26px;font-weight:700;line-height:1}
  .stat-sub{font-size:12px;color:var(--t2);margin-top:5px}

  /* CARDS GRID */
  .cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:40px}
  .cand-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;transition:border-color .2s;position:relative}
  .cand-card:hover{border-color:var(--border2)}
  .cand-card.top1{border-color:rgba(255,215,0,0.4);background:rgba(255,215,0,0.04)}
  .cand-card.top2{border-color:rgba(192,192,192,0.35)}
  .cand-card.top3{border-color:rgba(205,127,50,0.35)}
  .card-pos{font-size:11px;color:var(--t2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .medal{font-size:14px}
  .card-name{font-size:14px;font-weight:600;color:var(--white);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-email{font-size:11px;color:var(--t2);margin-bottom:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card-score{font-size:28px;font-weight:700;line-height:1;margin-bottom:4px}
  .card-score span{font-size:14px;font-weight:400;color:var(--t2)}
  .card-bar-wrap{height:4px;background:rgba(255,255,255,0.07);border-radius:2px;margin-bottom:8px}
  .card-bar{height:4px;border-radius:2px;transition:width .4s}
  .card-tag{font-size:11px;font-weight:500}
  .tag-acima{color:var(--green)}
  .tag-abaixo{color:var(--red)}
  .tag-medio{color:var(--yellow)}
  .card-pendente{color:var(--t2);font-size:12px;margin-top:8px}

  /* TABELA DETALHADA */
  .section-title{font-size:13px;font-weight:600;color:var(--green);text-transform:uppercase;letter-spacing:.06em;margin-bottom:14px}
  .table-wrap{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:800px}
  thead tr{border-bottom:1px solid var(--border)}
  th{padding:10px 12px;font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.04em;font-weight:600;text-align:center;white-space:nowrap;background:rgba(0,0,0,0.1)}
  th.th-left{text-align:left}
  th.th-cenario{color:var(--green);background:rgba(147,245,116,0.06)}
  tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
  tbody tr:last-child{border-bottom:none}
  tbody tr:hover{background:rgba(147,245,116,0.02)}
  td{padding:12px 12px;font-size:12px;text-align:center;vertical-align:middle}
  td.td-left{text-align:left}
  td.td-cenario{background:rgba(147,245,116,0.04)}

  /* CANDIDATO CELL */
  .tc-name{font-size:13px;font-weight:500;color:var(--white)}
  .tc-email{font-size:11px;color:var(--t2);margin-top:1px}

  /* NOTA BADGE */
  .nb{display:inline-flex;align-items:center;justify-content:center;width:28px;height:22px;border-radius:5px;font-size:11px;font-weight:600}
  .nb-0{color:var(--t1)}
  .nb-1{background:rgba(229,91,91,0.12);color:#E55B5B}
  .nb-2{background:rgba(246,195,67,0.12);color:#F6C343}
  .nb-3{background:rgba(103,138,136,0.18);color:var(--mist)}
  .nb-4{background:rgba(100,200,150,0.12);color:#64C896}
  .nb-5{background:rgba(147,245,116,0.12);color:var(--green)}

  /* SUBTOTAL CENÁRIO */
  .nb-sub{display:inline-flex;align-items:center;justify-content:center;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700;background:rgba(147,245,116,0.1);color:var(--green);border:1px solid var(--border2)}
  .nb-sub.baixo{background:rgba(229,91,91,0.1);color:var(--red);border-color:rgba(229,91,91,0.3)}
  .nb-sub.medio{background:rgba(246,195,67,0.1);color:var(--yellow);border-color:rgba(246,195,67,0.3)}

  /* TOTAL */
  .total-cell{font-size:14px;font-weight:700}
  .total-alto{color:var(--green)}
  .total-medio{color:var(--yellow)}
  .total-baixo{color:var(--red)}

  /* LOADING */
  .loading-wrap{padding:56px;text-align:center;color:var(--t2)}
  .loading-dots{display:inline-flex;gap:6px;margin-top:12px}
  .loading-dots span{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.2s ease-in-out infinite}
  .loading-dots span:nth-child(2){animation-delay:.2s}
  .loading-dots span:nth-child(3){animation-delay:.4s}
  @keyframes pulse{0%,100%{opacity:.2}50%{opacity:1}}

  @media(max-width:768px){
    .hdr,.page{padding-left:20px;padding-right:20px}
    .stats{grid-template-columns:1fr 1fr}
    .hdr-center{display:none}
    .cards-grid{grid-template-columns:1fr 1fr}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="logo-area">
    <div class="logo-mark">
      <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="#002726" opacity=".4"/></svg>
    </div>
    <span class="logo-name">Bling <span>Seletivo</span></span>
  </div>
  <div class="hdr-center">
    <strong id="hdr-titulo">Ranking</strong>
    <span id="hdr-sub">carregando…</span>
  </div>
  <div class="hdr-right">
    <button class="btn-s" onclick="window.location.href='avaliar.html?p='+processId">← Avaliar</button>
    <button class="btn-s" onclick="window.location.href='painel.html'">Painel</button>
    <button class="btn-p" onclick="exportarCSV()">⬇ CSV</button>
  </div>
</header>

<div class="page">

  <div class="top-bar">
    <div>
      <h1>Painel Comparativo</h1>
      <p id="ranking-sub">carregando…</p>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats">
    <div class="stat"><div class="stat-label">Candidatos</div><div class="stat-value" id="st-total">—</div><div class="stat-sub">enviaram respostas</div></div>
    <div class="stat"><div class="stat-label">Avaliados</div><div class="stat-value" id="st-aval" style="color:var(--green)">—</div><div class="stat-sub">com nota registrada</div></div>
    <div class="stat"><div class="stat-label">Maior nota</div><div class="stat-value" id="st-max" style="color:var(--green)">—</div><div class="stat-sub">pontuação máxima</div></div>
    <div class="stat"><div class="stat-label">Média geral</div><div class="stat-value" id="st-media">—</div><div class="stat-sub">dos avaliados</div></div>
  </div>

  <!-- CARDS -->
  <div class="section-title">Candidatos</div>
  <div class="cards-grid" id="cards-grid">
    <div class="loading-wrap" style="grid-column:1/-1">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

  <!-- TABELA DETALHADA -->
  <div class="section-title">Notas por cenário e questão</div>
  <div class="table-wrap" id="table-wrap">
    <div class="loading-wrap">
      <div class="loading-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxWXwMe3rE1zMSiIxmz5E34cc2BmyeGsw",
    authDomain: "bling-seletivo.firebaseapp.com",
    projectId: "bling-seletivo",
    storageBucket: "bling-seletivo.firebasestorage.app",
    messagingSenderId: "680949628238",
    appId: "1:680949628238:web:6e74791e02b69a1333321f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  window.processId = new URLSearchParams(window.location.search).get('p');
  let processo = null;
  let dados = [];

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    if (!window.processId) { window.location.href = 'painel.html'; return; }
    await carregarDados();
  });

  async function carregarDados() {
    try {
      const pSnap = await getDoc(doc(db, 'processes', window.processId));
      if (!pSnap.exists()) { window.location.href = 'painel.html'; return; }
      processo = { id: pSnap.id, ...pSnap.data() };

      document.getElementById('hdr-titulo').textContent = processo.title;
      document.getElementById('hdr-sub').textContent = `${processo.role} · ${processo.area}`;
      document.getElementById('ranking-sub').textContent = `${dados.length} candidatos · ${Object.keys({}).length} avaliados`;

      const [subSnap, evalSnap] = await Promise.all([
        getDocs(collection(db, 'processes', window.processId, 'submissions')),
        getDocs(collection(db, 'processes', window.processId, 'evaluations')),
      ]);

      const avaliacoes = {};
      evalSnap.forEach(d => avaliacoes[d.id] = d.data());

      dados = [];
      subSnap.forEach(d => {
        const sub = { id: d.id, ...d.data() };
        const aval = avaliacoes[d.id] || null;
        // Calcula total em 100 pontos
        const totalPontos = (aval?.avaliado || aval?.scores?.length) ? calcularTotal100(aval.scores, processo.blocos, aval) : null;
        dados.push({ ...sub, avaliacao: aval, total100: totalPontos });
      });

      // Ordena: avaliados por nota desc, depois pendentes
      dados.sort((a, b) => {
        if (a.total100 !== null && b.total100 !== null) return b.total100 - a.total100;
        if (a.total100 !== null) return -1;
        if (b.total100 !== null) return 1;
        return 0;
      });

      atualizarStats();
      renderCards();
      renderTabela();

      const avaliados = dados.filter(d => d.total100 !== null).length;
      document.getElementById('ranking-sub').textContent = `${dados.length} candidatos · ${avaliados} avaliados`;
    } catch(e) {
      console.error(e);
    }
  }

  function calcularPontuacaoReal(scores, blocos, aval) {
    // Usa total/totalMax salvo na avaliação se disponível
    if (aval?.avaliado && aval?.totalMax != null) {
      return { obtido: aval.total, maximo: aval.totalMax };
    }
    if (!scores || scores.length === 0) return null;
    const bl = blocos || [];
    let obtido = 0, maximo = 0;
    bl.forEach((b, si) => {
      (b.perguntas || []).forEach((p, qi) => {
        const pts = parseFloat(p.peso) || 0;
        if (pts === 0) return;
        const s = scores.find(sc => sc.si === si && sc.qi === qi);
        if (s != null) {
          if (s.auto) { obtido += s.score === 5 ? pts : 0; }
          else { obtido += (s.score / 5) * pts; }
          maximo += pts;
        }
      });
    });
    if (maximo === 0 && obtido === 0 && blocos.every(b => b.perguntas.every(p => !p.peso))) return null;
    return { obtido: Math.round(obtido * 100) / 100, maximo: Math.round(maximo * 100) / 100 };
  }

  function calcularTotal100(scores, blocos, aval) {
    const r = calcularPontuacaoReal(scores, blocos, aval);
    if (!r) return null;
    return Math.round((r.obtido / r.maximo) * 100);
  }

  function atualizarStats() {
    const avaliados = dados.filter(d => d.total100 !== null);
    document.getElementById('st-total').textContent = dados.length;
    document.getElementById('st-aval').textContent = avaliados.length;
    if (avaliados.length > 0) {
      const max = Math.max(...avaliados.map(d => d.total100));
      const media = Math.round(avaliados.reduce((a, b) => a + b.total100, 0) / avaliados.length);
      document.getElementById('st-max').textContent = max;
      document.getElementById('st-media').textContent = media;
    }
  }

  function renderCards() {
    const grid = document.getElementById('cards-grid');
    const medals = ['🥇','🥈','🥉'];
    let pos = 0;

    grid.innerHTML = dados.map((c, i) => {
      const avaliado = c.total100 !== null;
      if (avaliado) pos++;
      const posReal = avaliado ? pos : null;
      const cardClass = posReal === 1 ? 'top1' : posReal === 2 ? 'top2' : posReal === 3 ? 'top3' : '';
      const medal = posReal && posReal <= 3 ? medals[posReal-1] : '';
      const barColor = c.total100 >= 70 ? 'var(--green)' : c.total100 >= 50 ? 'var(--yellow)' : 'var(--red)';
      const tag = c.total100 >= 70 ? '<span class="card-tag tag-acima">Acima do esperado</span>'
                : c.total100 >= 50 ? '<span class="card-tag tag-medio">Na média</span>'
                : c.total100 !== null ? '<span class="card-tag tag-abaixo">Abaixo do esperado</span>' : '';

      return `<div class="cand-card ${cardClass}">
        <div class="card-pos">
          ${medal ? `<span class="medal">${medal}</span>` : ''}
          <span>${posReal ? '#'+posReal : '#'+(i+1)}</span>
        </div>
        <div class="card-name" title="${esc(c.name)}">${esc(c.name)}</div>
        <div class="card-email" title="${esc(c.email)}">${esc(c.email)}</div>
        ${avaliado ? `
          <div class="card-score" style="color:${barColor};font-size:22px">${ptsLabel}</div>
          <div class="card-bar-wrap"><div class="card-bar" style="width:${c.total100}%;background:${barColor}"></div></div>
          ${tag}
        ` : `<div class="card-pendente">Aguardando avaliação</div>`}
      </div>`;
    }).join('');
  }

  function renderTabela() {
    const wrap = document.getElementById('table-wrap');
    const scs = processo.scenarios;

    // Cabeçalhos
    let thead = `<tr><th class="th-left" style="min-width:160px">Candidato</th>`;
    scs.forEach((sc, si) => {
      sc.questions.forEach((q, qi) => {
        thead += `<th>C${si+1} Q${qi+1}</th>`;
      });
      thead += `<th class="th-cenario">C${si+1}</th>`;
    });
    thead += `<th style="min-width:60px">Total</th></tr>`;

    // Linhas
    let tbody = '';
    dados.forEach(c => {
      tbody += `<tr>
        <td class="td-left">
          <div class="tc-name">${esc(c.name)}</div>
          <div class="tc-email">${esc(c.email)}</div>
        </td>`;

      scs.forEach((sc, si) => {
        let subtotal = 0, maxSub = sc.questions.length * 5, contadas = 0;
        sc.questions.forEach((q, qi) => {
          const score = c.avaliacao?.scores?.find(s => s.si === si && s.qi === qi)?.score;
          if (score != null) { subtotal += score; contadas++; }
          tbody += `<td>${score != null ? `<span class="nb nb-${score}">${score}</span>` : '<span style="color:var(--t1)">—</span>'}</td>`;
        });
        const subClass = contadas === 0 ? '' : subtotal/maxSub >= 0.7 ? '' : subtotal/maxSub >= 0.5 ? 'medio' : 'baixo';
        tbody += `<td class="td-cenario">${contadas > 0 ? `<span class="nb-sub ${subClass}">${subtotal}/${maxSub}</span>` : '<span style="color:var(--t1)">—</span>'}</td>`;
      });

      const t = c.total100;
      const tClass = t == null ? '' : t >= 70 ? 'total-alto' : t >= 50 ? 'total-medio' : 'total-baixo';
      tbody += `<td><span class="total-cell ${tClass}">${t != null ? t : '—'}</span></td></tr>`;
    });

    wrap.innerHTML = `<table><thead>${thead}</thead><tbody>${tbody}</tbody></table>`;
  }

  // EXPORTAR CSV
  window.exportarCSV = function() {
    if (!processo || dados.length === 0) return;
    const scs = processo.scenarios;
    const headers = ['Posição','Nome','E-mail'];
    scs.forEach((sc, si) => {
      sc.questions.forEach((q, qi) => headers.push(`C${si+1} Q${qi+1}`));
      headers.push(`C${si+1} Subtotal`);
    });
    headers.push('Total (100)');

    let pos = 0;
    const linhas = dados.map((c, i) => {
      if (c.total100 !== null) pos++;
      const row = [c.total100 !== null ? pos : '—', c.name, c.email];
      scs.forEach((sc, si) => {
        let sub = 0, max = sc.questions.length * 5, cnt = 0;
        sc.questions.forEach((q, qi) => {
          const s = c.avaliacao?.scores?.find(s => s.si === si && s.qi === qi)?.score;
          row.push(s != null ? s : '—');
          if (s != null) { sub += s; cnt++; }
        });
        row.push(cnt > 0 ? `${sub}/${max}` : '—');
      });
      row.push(c.total100 != null ? c.total100 : '—');
      return row;
    });

    const csv = [headers, ...linhas].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `ranking-${processo.title.replace(/\s+/g,'-').toLowerCase()}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  function esc(str) {
    return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
</script>

</body>
</html>
