<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Seletivo — Construtor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;
    --mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;--card2:#042F2E;
    --border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);
    --yellow:#F6C343;--red:#E55B5B;
  }
  html,body{height:100%;font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased}

  /* ── HEADER ── */
  .hdr{height:68px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:10}
  .logo-area{display:flex;align-items:center;gap:12px}
  .logo-mark{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-mark svg{width:18px;height:18px}
  .logo-name{font-size:15px;font-weight:600}
  .logo-name span{color:var(--green)}
  .hdr-right{display:flex;align-items:center;gap:12px}
  .btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
  .btn-s:hover{border-color:var(--t2);color:var(--white)}
  .btn-p{background:var(--green);color:var(--dark);border:none;border-radius:12px;padding:10px 22px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
  .btn-p:hover{opacity:.88}
  .btn-p:disabled{opacity:.4;cursor:not-allowed}

  /* ── STEPS ── */
  .steps-bar{padding:20px 48px;border-bottom:1px solid var(--border);display:flex;gap:0;align-items:center}
  .step-item{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 12px;border-radius:10px;transition:background .15s}
  .step-item:hover{background:rgba(147,245,116,0.04)}
  .step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;transition:all .2s}
  .step-num.done{background:var(--green);color:var(--dark)}
  .step-num.active{background:var(--green);color:var(--dark)}
  .step-num.pending{background:rgba(255,255,255,0.07);color:var(--t2);border:1px solid var(--border)}
  .step-label{font-size:13px;font-weight:500}
  .step-label.active{color:var(--white)}
  .step-label.pending{color:var(--t2)}
  .step-divider{width:40px;height:1px;background:var(--border);flex-shrink:0;margin:0 4px}

  /* ── CONTENT ── */
  .content{max-width:760px;margin:0 auto;padding:44px 40px 100px}

  /* ── SECTION TITLE ── */
  .sec-title{font-size:22px;font-weight:600;margin-bottom:6px}
  .sec-sub{font-size:14px;color:var(--t2);margin-bottom:32px;line-height:1.6}

  /* ── FORM ── */
  .fg{margin-bottom:18px}
  .fg label{font-size:13px;color:var(--mist);margin-bottom:7px;display:block;font-weight:500}
  .fg input,.fg select,.fg textarea{
    width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;color:var(--white);font-size:14px;
    font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;
  }
  .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--green)}
  .fg input::placeholder,.fg textarea::placeholder{color:var(--t1)}
  .fg select option{background:var(--card)}
  .fg textarea{resize:vertical;min-height:80px;line-height:1.6}
  .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fg-hint{font-size:12px;color:var(--t2);margin-top:5px}

  /* ── CENÁRIO CARD ── */
  .cenario-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .cenario-header{padding:16px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
  .cenario-header:hover{background:rgba(147,245,116,0.03)}
  .cenario-header-left{display:flex;align-items:center;gap:12px}
  .cenario-tag{font-size:11px;color:var(--green);font-weight:600;text-transform:uppercase;letter-spacing:.05em;background:rgba(147,245,116,0.1);border:1px solid var(--border2);padding:3px 10px;border-radius:99px}
  .cenario-titulo-preview{font-size:14px;font-weight:500;color:var(--mist)}
  .cenario-header-right{display:flex;align-items:center;gap:8px}
  .btn-ico{background:transparent;border:1px solid var(--border);border-radius:8px;padding:5px 10px;font-size:12px;color:var(--t2);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
  .btn-ico:hover{border-color:var(--border2);color:var(--white)}
  .btn-ico.danger:hover{border-color:rgba(229,91,91,0.4);color:var(--red)}
  .chevron{font-size:12px;color:var(--t2);transition:transform .2s}
  .chevron.open{transform:rotate(180deg)}
  .cenario-body{padding:0 20px 20px;border-top:1px solid var(--border);display:none}
  .cenario-body.open{display:block}

  /* ── PERGUNTA ── */
  .pergunta-item{background:rgba(0,0,0,0.15);border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin-top:12px;display:flex;gap:12px;align-items:flex-start}
  .perg-num{width:24px;height:24px;border-radius:50%;background:rgba(147,245,116,0.1);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--green);flex-shrink:0;margin-top:1px}
  .perg-input{flex:1;background:transparent;border:none;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:none;min-height:40px;line-height:1.65}
  .perg-input::placeholder{color:var(--t1)}
  .btn-remove{background:transparent;border:none;color:var(--t2);cursor:pointer;font-size:14px;padding:2px;transition:color .15s;flex-shrink:0}
  .btn-remove:hover{color:var(--red)}

  .add-perg-btn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green);background:transparent;border:1px dashed var(--border2);border-radius:10px;padding:10px 14px;cursor:pointer;width:100%;margin-top:10px;font-family:'Inter',sans-serif;transition:all .15s}
  .add-perg-btn:hover{background:rgba(147,245,116,0.04)}

  .add-cenario-btn{display:flex;align-items:center;justify-content:center;gap:10px;font-size:14px;color:var(--green);background:transparent;border:1px dashed var(--border2);border-radius:14px;padding:16px;cursor:pointer;width:100%;font-family:'Inter',sans-serif;transition:all .15s;margin-top:4px}
  .add-cenario-btn:hover{background:rgba(147,245,116,0.04)}

  /* ── CRITÉRIOS ── */
  .criterio-block{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .criterio-header{padding:16px 20px;border-bottom:1px solid var(--border)}
  .criterio-perg-num{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .criterio-perg-txt{font-size:14px;color:var(--white);font-weight:500;line-height:1.5}
  .criterio-notas{padding:16px 20px;display:flex;flex-direction:column;gap:10px}
  .nota-row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
  .nota-label{width:48px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0}
  .nota-1{background:rgba(229,91,91,0.15);color:#E55B5B}
  .nota-2{background:rgba(246,195,67,0.15);color:#F6C343}
  .nota-3{background:rgba(103,138,136,0.2);color:var(--mist)}
  .nota-4{background:rgba(100,200,150,0.15);color:#64C896}
  .nota-5{background:rgba(147,245,116,0.15);color:var(--green)}
  .nota-input{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .2s}
  .nota-input:focus{border-color:var(--green)}
  .nota-input::placeholder{color:var(--t1)}
  .btn-sugerir{background:rgba(147,245,116,0.07);border:1px solid var(--border2);border-radius:8px;padding:7px 14px;font-size:12px;color:var(--green);font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap;flex-shrink:0}
  .btn-sugerir:hover{background:rgba(147,245,116,0.14)}

  /* ── FOOTER FIXO ── */
  .footer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--dark);border-top:1px solid var(--border);padding:14px 48px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .footer-info{font-size:12px;color:var(--t2)}
  .footer-info strong{color:var(--green)}
  .footer-btns{display:flex;gap:10px}

  /* ── TOAST ── */
  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--border2);border-radius:12px;padding:12px 20px;font-size:13px;color:var(--green);display:none;z-index:999;box-shadow:0 8px 32px rgba(0,0,0,0.4)}

  @media(max-width:640px){
    .hdr,.steps-bar,.footer-bar{padding-left:20px;padding-right:20px}
    .content{padding:28px 20px 100px}
    .fg-row{grid-template-columns:1fr}
    .steps-bar{overflow-x:auto;gap:0}
    .step-label{display:none}
    .step-divider{width:20px}
  }
</style>
</head>
<body>

<!-- HEADER -->
<header class="hdr">
  <div class="logo-area">
    <div class="logo-mark">
      <svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="#002726" opacity=".4"/></svg>
    </div>
    <span class="logo-name">Bling <span>Seletivo</span></span>
  </div>
  <div class="hdr-right">
    <button class="btn-s" onclick="window.location.href='painel.html'">← Painel</button>
  </div>
</header>

<!-- STEPS BAR -->
<div class="steps-bar">
  <div class="step-item" onclick="irPara(1)">
    <div class="step-num active" id="sn-1">1</div>
    <span class="step-label active" id="sl-1">Informações</span>
  </div>
  <div class="step-divider"></div>
  <div class="step-item" onclick="irPara(2)">
    <div class="step-num pending" id="sn-2">2</div>
    <span class="step-label pending" id="sl-2">Cenários e perguntas</span>
  </div>
  <div class="step-divider"></div>
  <div class="step-item" onclick="irPara(3)">
    <div class="step-num pending" id="sn-3">3</div>
    <span class="step-label pending" id="sl-3">Critérios de avaliação</span>
  </div>
</div>

<!-- CONTENT -->
<div class="content" id="content"></div>

<!-- FOOTER -->
<div class="footer-bar">
  <div class="footer-info" id="footer-info"></div>
  <div class="footer-btns">
    <button class="btn-s" id="btn-anterior" onclick="anterior()" style="display:none">← Anterior</button>
    <button class="btn-s" id="btn-salvar" onclick="salvarRascunho()">💾 Salvar rascunho</button>
    <button class="btn-p" id="btn-proximo" onclick="proximo()">Próximo →</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxWXwMe3rE1zMSiIxmz5E34cc2BmyeGsw",
    authDomain: "bling-seletivo.firebaseapp.com",
    projectId: "bling-seletivo",
    storageBucket: "bling-seletivo.firebasestorage.app",
    messagingSenderId: "680949628238",
    appId: "1:680949628238:web:6e74791e02b69a1333321f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let processId = new URLSearchParams(window.location.search).get('p');
  let etapa = 1;

  // Estado do processo
  let dados = {
    title: '', role: '', area: '', deadline: '',
    scenarios: []
  };

  // ── GUARD ──
  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    currentUser = user;
    if (processId) await carregarProcesso();
    renderEtapa(1);
  });

  async function carregarProcesso() {
    try {
      const snap = await getDoc(doc(db, 'processes', processId));
      if (snap.exists()) {
        const d = snap.data();
        dados.title    = d.title || '';
        dados.role     = d.role || '';
        dados.area     = d.area || '';
        dados.deadline = d.deadline ? new Date(d.deadline.seconds * 1000).toISOString().split('T')[0] : '';
        dados.scenarios = d.scenarios || [];
      }
    } catch(e) { console.error(e); }
  }

  // ── RENDER ETAPAS ──
  window.renderEtapa = function(n) {
    etapa = n;
    atualizarSteps();
    const c = document.getElementById('content');

    if (n === 1) {
      c.innerHTML = `
        <h2 class="sec-title">Informações do processo</h2>
        <p class="sec-sub">Defina o nome, cargo, área e prazo. Essas informações aparecem para os candidatos na tela inicial do desafio.</p>
        <div class="fg">
          <label>Nome do processo</label>
          <input type="text" id="f-titulo" placeholder="Ex: Seleção Suporte L3 — Q4 2025" value="${esc(dados.title)}">
        </div>
        <div class="fg-row">
          <div class="fg">
            <label>Cargo</label>
            <input type="text" id="f-cargo" placeholder="Ex: Analista de Suporte L3" value="${esc(dados.role)}">
          </div>
          <div class="fg">
            <label>Área</label>
            <input type="text" id="f-area" placeholder="Ex: Suporte Técnico" value="${esc(dados.area)}">
          </div>
        </div>
        <div class="fg" style="max-width:260px">
          <label>Prazo para entrega</label>
          <input type="date" id="f-prazo" value="${esc(dados.deadline)}">
          <p class="fg-hint">Os candidatos verão este prazo na tela inicial.</p>
        </div>`;
      document.getElementById('btn-anterior').style.display = 'none';
      document.getElementById('btn-proximo').textContent = 'Próximo →';
      document.getElementById('footer-info').innerHTML = 'Etapa <strong>1 de 3</strong> — Informações básicas';
    }

    else if (n === 2) {
      renderEtapa2();
      document.getElementById('btn-anterior').style.display = 'inline-flex';
      document.getElementById('btn-proximo').textContent = 'Próximo →';
      document.getElementById('footer-info').innerHTML = `Etapa <strong>2 de 3</strong> — <strong>${dados.scenarios.length}</strong> cenário(s)`;
    }

    else if (n === 3) {
      renderEtapa3();
      document.getElementById('btn-anterior').style.display = 'inline-flex';
      document.getElementById('btn-proximo').textContent = '✦ Salvar processo';
      document.getElementById('footer-info').innerHTML = 'Etapa <strong>3 de 3</strong> — Critérios de avaliação';
    }
  };

  function renderEtapa2() {
    const c = document.getElementById('content');
    if (dados.scenarios.length === 0) dados.scenarios.push(novoCenario(1));

    c.innerHTML = `
      <h2 class="sec-title">Cenários e perguntas</h2>
      <p class="sec-sub">Adicione os cenários do processo. Cada cenário tem um contexto e uma ou mais perguntas para o candidato responder.</p>
      <div id="cenarios-lista"></div>
      <button class="add-cenario-btn" onclick="adicionarCenario()">+ Adicionar cenário</button>`;
    renderCenarios();
  }

  function renderCenarios() {
    const lista = document.getElementById('cenarios-lista');
    if (!lista) return;
    lista.innerHTML = dados.scenarios.map((sc, si) => `
      <div class="cenario-card" id="sc-${si}">
        <div class="cenario-header" onclick="toggleCenario(${si})">
          <div class="cenario-header-left">
            <span class="cenario-tag">Cenário ${String(si+1).padStart(2,'0')}</span>
            <span class="cenario-titulo-preview" id="prev-${si}">${sc.title || 'Sem título'}</span>
          </div>
          <div class="cenario-header-right">
            <button class="btn-ico danger" onclick="event.stopPropagation();removerCenario(${si})">🗑</button>
            <span class="chevron" id="chev-${si}">▾</span>
          </div>
        </div>
        <div class="cenario-body open" id="cb-${si}">
          <div style="padding-top:16px">
            <div class="fg">
              <label>Título do cenário</label>
              <input type="text" id="sc-title-${si}" placeholder="Ex: Triagem de Ouvidoria"
                value="${esc(sc.title)}"
                oninput="dados.scenarios[${si}].title=this.value;document.getElementById('prev-${si}').textContent=this.value||'Sem título'">
            </div>
            <div class="fg">
              <label>Contexto / situação</label>
              <textarea id="sc-ctx-${si}" placeholder="Descreva a situação que o candidato vai enfrentar…" rows="4"
                oninput="dados.scenarios[${si}].context=this.value">${esc(sc.context)}</textarea>
            </div>
            <div style="margin-top:16px">
              <div style="font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Perguntas</div>
              <div id="pergs-${si}">
                ${sc.questions.map((q, qi) => `
                  <div class="pergunta-item" id="pq-${si}-${qi}">
                    <div class="perg-num">${qi+1}</div>
                    <textarea class="perg-input" rows="2" placeholder="Escreva a pergunta…"
                      oninput="dados.scenarios[${si}].questions[${qi}].text=this.value">${esc(q.text)}</textarea>
                    <button class="btn-remove" onclick="removerPergunta(${si},${qi})" title="Remover pergunta">×</button>
                  </div>`).join('')}
              </div>
              <button class="add-perg-btn" onclick="adicionarPergunta(${si})">+ Adicionar pergunta</button>
            </div>
          </div>
        </div>
      </div>`).join('');
  }

  function renderEtapa3() {
    const c = document.getElementById('content');
    const todasPergs = [];
    dados.scenarios.forEach((sc, si) => {
      sc.questions.forEach((q, qi) => {
        todasPergs.push({ si, qi, title: sc.title, text: q.text, criteria: q.criteria || [] });
      });
    });

    if (todasPergs.length === 0) {
      c.innerHTML = `
        <h2 class="sec-title">Critérios de avaliação</h2>
        <p class="sec-sub" style="color:var(--yellow)">⚠️ Adicione perguntas nos cenários antes de definir os critérios.</p>`;
      return;
    }

    c.innerHTML = `
      <h2 class="sec-title">Critérios de avaliação</h2>
      <p class="sec-sub">Para cada pergunta, defina o que caracteriza cada nota de 1 a 5. Isso vai aparecer ao lado das respostas dos candidatos na hora de avaliar.</p>
      ${todasPergs.map(({si, qi, title, text, criteria}) => `
        <div class="criterio-block">
          <div class="criterio-header" style="display:flex;align-items:flex-start;justify-content:space-between;gap:16px">
            <div>
              <div class="criterio-perg-num">Cenário ${si+1} — ${esc(title || 'Sem título')} · Pergunta ${qi+1}</div>
              <div class="criterio-perg-txt">${esc(text || 'Pergunta sem texto')}</div>
            </div>
            <button class="btn-sugerir" onclick="sugerirCriterios(${si},${qi})">✨ Sugerir critérios</button>
          </div>
          <div class="criterio-notas" id="notas-${si}-${qi}">
            ${[1,2,3,4,5].map(n => {
              const val = criteria.find(c => c.score === n)?.description || '';
              return `
                <div class="nota-row">
                  <div class="nota-label nota-${n}">${n}</div>
                  <input class="nota-input" type="text"
                    id="crit-${si}-${qi}-${n}"
                    placeholder="${placeholderNota(n)}"
                    value="${esc(val)}"
                    oninput="salvarCriterio(${si},${qi},${n},this.value)">
                </div>`;
            }).join('')}
          </div>
        </div>`).join('')}`;
  }

  function placeholderNota(n) {
    const p = {
      1: 'Resposta muito superficial, sem embasamento…',
      2: 'Identifica o problema mas a abordagem é incompleta…',
      3: 'Resposta adequada com raciocínio claro…',
      4: 'Resposta completa com boa estrutura e exemplos…',
      5: 'Resposta excepcional, demonstra domínio total…'
    };
    return p[n];
  }

  // Critérios sugeridos genéricos
  const CRITERIOS_SUGERIDOS = {
    1: 'Resposta muito superficial ou fora do contexto, sem demonstrar compreensão do problema.',
    2: 'Identifica o problema mas a abordagem é incompleta, confusa ou sem justificativa.',
    3: 'Resposta adequada com raciocínio claro e organizado, atende ao esperado para a vaga.',
    4: 'Resposta completa, bem estruturada, com exemplos práticos e boa comunicação.',
    5: 'Resposta excepcional — demonstra domínio total, visão estratégica e proatividade.'
  };

  window.sugerirCriterios = function(si, qi) {
    const btn = document.querySelector(`[onclick="sugerirCriterios(${si},${qi})"]`);
    if (btn) { btn.textContent = '✓ Aplicado!'; btn.style.color = 'var(--green)'; setTimeout(() => { btn.textContent = '✨ Sugerir critérios'; btn.style.color = ''; }, 2000); }
    [1,2,3,4,5].forEach(n => {
      const input = document.getElementById(`crit-${si}-${qi}-${n}`);
      if (input) { input.value = CRITERIOS_SUGERIDOS[n]; salvarCriterio(si, qi, n, CRITERIOS_SUGERIDOS[n]); }
    });
  };

  window.salvarCriterio = function(si, qi, score, desc) {
    if (!dados.scenarios[si]?.questions[qi]) return;
    let crit = dados.scenarios[si].questions[qi].criteria || [];
    const idx = crit.findIndex(c => c.score === score);
    if (idx >= 0) crit[idx].description = desc;
    else crit.push({ score, description: desc });
    dados.scenarios[si].questions[qi].criteria = crit;
  };

  // ── CENÁRIOS ──
  window.toggleCenario = function(si) {
    const body = document.getElementById(`cb-${si}`);
    const chev = document.getElementById(`chev-${si}`);
    body.classList.toggle('open');
    chev.classList.toggle('open');
  };

  window.adicionarCenario = function() {
    coletarDadosEtapa2();
    dados.scenarios.push(novoCenario(dados.scenarios.length + 1));
    renderCenarios();
    document.getElementById('footer-info').innerHTML = `Etapa <strong>2 de 3</strong> — <strong>${dados.scenarios.length}</strong> cenário(s)`;
  };

  window.removerCenario = function(si) {
    if (dados.scenarios.length === 1) { toast('O processo precisa ter ao menos um cenário.'); return; }
    if (!confirm('Remover este cenário e todas as suas perguntas?')) return;
    coletarDadosEtapa2();
    dados.scenarios.splice(si, 1);
    renderCenarios();
  };

  window.adicionarPergunta = function(si) {
    coletarDadosEtapa2();
    dados.scenarios[si].questions.push({ text: '', criteria: [] });
    renderCenarios();
    // Re-abre o cenário correto
    const body = document.getElementById(`cb-${si}`);
    if (body) body.classList.add('open');
  };

  window.removerPergunta = function(si, qi) {
    if (dados.scenarios[si].questions.length === 1) { toast('O cenário precisa ter ao menos uma pergunta.'); return; }
    coletarDadosEtapa2();
    dados.scenarios[si].questions.splice(qi, 1);
    renderCenarios();
    const body = document.getElementById(`cb-${si}`);
    if (body) body.classList.add('open');
  };

  function novoCenario(n) {
    return { title: '', context: '', questions: [{ text: '', criteria: [] }] };
  }

  // ── COLETA DADOS ──
  function coletarDadosEtapa1() {
    dados.title    = document.getElementById('f-titulo')?.value.trim() || dados.title;
    dados.role     = document.getElementById('f-cargo')?.value.trim()  || dados.role;
    dados.area     = document.getElementById('f-area')?.value.trim()   || dados.area;
    dados.deadline = document.getElementById('f-prazo')?.value         || dados.deadline;
  }

  function coletarDadosEtapa2() {
    dados.scenarios.forEach((sc, si) => {
      sc.title   = document.getElementById(`sc-title-${si}`)?.value ?? sc.title;
      sc.context = document.getElementById(`sc-ctx-${si}`)?.value   ?? sc.context;
      sc.questions.forEach((q, qi) => {
        const el = document.getElementById(`pq-${si}-${qi}`)?.querySelector('textarea');
        if (el) q.text = el.value;
      });
    });
  }

  // ── NAVEGAR ──
  window.proximo = function() {
    if (etapa === 1) {
      coletarDadosEtapa1();
      if (!dados.title || !dados.role || !dados.area || !dados.deadline) {
        toast('Preencha todos os campos antes de continuar.'); return;
      }
      renderEtapa(2);
    } else if (etapa === 2) {
      coletarDadosEtapa2();
      const semTitulo = dados.scenarios.some(s => !s.title.trim());
      if (semTitulo) { toast('Todos os cenários precisam ter um título.'); return; }
      const semPerg = dados.scenarios.some(s => s.questions.every(q => !q.text.trim()));
      if (semPerg) { toast('Cada cenário precisa ter ao menos uma pergunta.'); return; }
      renderEtapa(3);
    } else if (etapa === 3) {
      salvarProcesso();
    }
  };

  window.anterior = function() {
    if (etapa === 2) { coletarDadosEtapa2(); renderEtapa(1); }
    else if (etapa === 3) renderEtapa(2);
  };

  window.irPara = function(n) {
    if (n > etapa) return; // só volta
    if (etapa === 1) coletarDadosEtapa1();
    if (etapa === 2) coletarDadosEtapa2();
    renderEtapa(n);
  };

  // ── SALVAR ──
  window.salvarRascunho = async function() {
    if (etapa === 1) coletarDadosEtapa1();
    if (etapa === 2) coletarDadosEtapa2();
    await salvarNoFirestore('draft');
    toast('✅ Rascunho salvo!');
  };

  async function salvarProcesso() {
    coletarDadosEtapa2();
    const btn = document.getElementById('btn-proximo');
    btn.disabled = true;
    btn.textContent = 'Salvando…';
    await salvarNoFirestore('draft');
    btn.disabled = false;
    btn.textContent = '✦ Salvar processo';
    toast('✅ Processo salvo! Publique no painel quando estiver pronto.');
    setTimeout(() => window.location.href = 'painel.html', 2000);
  }

  async function salvarNoFirestore(status) {
    if (!currentUser) return;
    try {
      const payload = {
        ownerUid: currentUser.uid,
        ownerEmail: currentUser.email,
        title: dados.title,
        role: dados.role,
        area: dados.area,
        deadline: dados.deadline ? new Date(dados.deadline + 'T23:59:00') : null,
        status,
        scenarios: dados.scenarios,
        updatedAt: serverTimestamp(),
      };
      if (!processId) {
        payload.createdAt = serverTimestamp();
        const { addDoc, collection } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        const ref = await addDoc(collection(db, 'processes'), payload);
        processId = ref.id;
        window.history.replaceState({}, '', `?p=${processId}`);
      } else {
        await setDoc(doc(db, 'processes', processId), payload, { merge: true });
      }
    } catch(e) { toast('Erro ao salvar: ' + e.message); }
  }

  // ── STEPS VISUAIS ──
  function atualizarSteps() {
    [1,2,3].forEach(n => {
      const num = document.getElementById(`sn-${n}`);
      const lbl = document.getElementById(`sl-${n}`);
      if (n < etapa) { num.className='step-num done'; num.textContent='✓'; lbl.className='step-label active'; }
      else if (n === etapa) { num.className='step-num active'; num.textContent=n; lbl.className='step-label active'; }
      else { num.className='step-num pending'; num.textContent=n; lbl.className='step-label pending'; }
    });
  }

  // ── UTILS ──
  function esc(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
  }
  window.toast = toast;
</script>

</body>
</html>
