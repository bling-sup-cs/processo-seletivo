<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Seletivo — Construtor</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;
    --mist:#B9C9C9;--white:#FFFFFF;--card:#03302F;
    --border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);
    --yellow:#F6C343;--red:#E55B5B;
  }
  html,body{height:100%;font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased}

  .hdr{height:68px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--dark);z-index:10}
  .logo-area{display:flex;align-items:center;gap:12px}
  .logo-mark{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-mark svg{width:18px;height:18px}
  .logo-name{font-size:15px;font-weight:600}.logo-name span{color:var(--green)}
  .hdr-right{display:flex;align-items:center;gap:12px}
  .btn-s{background:transparent;color:var(--mist);border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s}
  .btn-s:hover{border-color:var(--t2);color:var(--white)}
  .btn-p{background:var(--green);color:var(--dark);border:none;border-radius:12px;padding:10px 22px;font-size:14px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s}
  .btn-p:hover{opacity:.88}
  .btn-p:disabled{opacity:.4;cursor:not-allowed}

  .steps-bar{padding:20px 48px;border-bottom:1px solid var(--border);display:flex;gap:0;align-items:center}
  .step-item{display:flex;align-items:center;gap:10px;cursor:pointer;padding:6px 12px;border-radius:10px;transition:background .15s}
  .step-item:hover{background:rgba(147,245,116,0.04)}
  .step-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;transition:all .2s}
  .step-num.done{background:var(--green);color:var(--dark)}
  .step-num.active{background:var(--green);color:var(--dark)}
  .step-num.pending{background:rgba(255,255,255,0.07);color:var(--t2);border:1px solid var(--border)}
  .step-label{font-size:13px;font-weight:500}
  .step-label.active{color:var(--white)}
  .step-label.pending{color:var(--t2)}
  .step-divider{width:40px;height:1px;background:var(--border);flex-shrink:0;margin:0 4px}

  .content{max-width:760px;margin:0 auto;padding:44px 40px 100px}
  .sec-title{font-size:22px;font-weight:600;margin-bottom:6px}
  .sec-sub{font-size:14px;color:var(--t2);margin-bottom:32px;line-height:1.6}

  .fg{margin-bottom:18px}
  .fg label{font-size:13px;color:var(--mist);margin-bottom:7px;display:block;font-weight:500}
  .fg input,.fg select,.fg textarea{width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;color:var(--white);font-size:14px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
  .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--green)}
  .fg input::placeholder,.fg textarea::placeholder{color:var(--t1)}
  .fg select option{background:var(--card)}
  .fg textarea{resize:vertical;min-height:80px;line-height:1.6}
  .fg-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}

  /* BLOCO */
  .bloco-card{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .bloco-header{padding:14px 20px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:background .15s}
  .bloco-header:hover{background:rgba(147,245,116,0.03)}
  .bloco-header-left{display:flex;align-items:center;gap:10px}
  .bloco-tipo-badge{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding:3px 10px;border-radius:99px}
  .badge-cenario{background:rgba(147,245,116,0.1);color:var(--green);border:1px solid var(--border2)}
  .badge-questao{background:rgba(103,138,136,0.2);color:var(--mist);border:1px solid rgba(103,138,136,0.3)}
  .bloco-titulo-preview{font-size:14px;font-weight:500;color:var(--mist)}
  .bloco-header-right{display:flex;align-items:center;gap:8px}
  .btn-del{background:transparent;border:1px solid rgba(229,91,91,0.3);border-radius:8px;padding:5px 9px;cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center}
  .btn-del:hover{background:rgba(229,91,91,0.08);border-color:rgba(229,91,91,0.5)}
  .chevron{font-size:12px;color:var(--t2);transition:transform .2s;padding:2px 6px}
  .chevron.open{transform:rotate(180deg)}
  .bloco-body{padding:0 20px 20px;border-top:1px solid var(--border);display:none}
  .bloco-body.open{display:block}

  /* PERGUNTA SIMPLES (etapa 2) */
  .perg-simples{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:rgba(0,0,0,0.15);border:1px solid var(--border);border-radius:10px;margin-top:10px}
  .perg-num{width:24px;height:24px;border-radius:50%;background:rgba(147,245,116,0.1);border:1px solid var(--border2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:var(--green);flex-shrink:0;margin-top:2px}
  .perg-input{flex:1;background:transparent;border:none;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;resize:none;min-height:36px;line-height:1.65}
  .perg-input::placeholder{color:var(--t1)}
  .btn-remove{background:transparent;border:none;color:var(--t2);cursor:pointer;font-size:16px;padding:0;flex-shrink:0;transition:color .15s;line-height:1}
  .btn-remove:hover{color:var(--red)}
  .perg-tipo-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .perg-tipo-label{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
  .perg-tipo-btn{background:transparent;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;color:var(--t2);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
  .perg-tipo-btn:hover{border-color:var(--border2);color:var(--white)}
  .perg-tipo-btn.active{background:rgba(147,245,116,0.08);border-color:var(--border2);color:var(--green)}
  .add-perg-btn{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--green);background:transparent;border:1px dashed var(--border2);border-radius:10px;padding:10px 14px;cursor:pointer;width:100%;margin-top:10px;font-family:'Inter',sans-serif;transition:all .15s}
  .add-perg-btn:hover{background:rgba(147,245,116,0.04)}

  /* ADD BLOCO */
  .tipos-explicacao{display:flex;flex-direction:column;gap:10px;margin-bottom:28px}
  .tipo-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .tipo-card-icon{font-size:28px;flex-shrink:0}
  .tipo-card-info{flex:1;min-width:200px}
  .tipo-card-titulo{font-size:14px;font-weight:600;color:var(--white);margin-bottom:4px}
  .tipo-card-desc{font-size:13px;color:var(--t2);line-height:1.6}
  .add-bloco-btn-inline{background:var(--green);color:var(--dark);border:none;border-radius:10px;padding:9px 18px;font-size:13px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;white-space:nowrap;flex-shrink:0}
  .add-bloco-btn-inline:hover{opacity:.88}
  .add-bloco-btn-inline.questao{background:transparent;color:var(--mist);border:1px solid var(--border)}
  .add-bloco-btn-inline.questao:hover{border-color:var(--t2);color:var(--white)}
  .add-bloco-row{display:flex;gap:10px;margin-top:4px}
  .add-bloco-btn{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;color:var(--green);background:transparent;border:1px dashed var(--border2);border-radius:14px;padding:14px;cursor:pointer;flex:1;font-family:'Inter',sans-serif;transition:all .15s}
  .add-bloco-btn:hover{background:rgba(147,245,116,0.04)}
  .add-bloco-btn.questao{color:var(--mist);border-color:rgba(103,138,136,0.3)}
  .add-bloco-btn.questao:hover{border-color:var(--t2)}

  /* ETAPA 3 — AVALIAÇÃO */
  .aval-block{background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:14px;overflow:hidden}
  .aval-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
  .aval-perg-num{font-size:11px;color:var(--green);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
  .aval-perg-txt{font-size:14px;color:var(--white);font-weight:500;line-height:1.5}
  .aval-body{padding:16px 20px;display:flex;flex-direction:column;gap:14px}

  /* TIPO SELECTOR */
  .tipo-selector-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .tipo-sel-label{font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em}
  .tipo-sel-btn{background:transparent;border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:12px;color:var(--mist);cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
  .tipo-sel-btn:hover{border-color:var(--border2);color:var(--white)}
  .tipo-sel-btn.active{background:rgba(147,245,116,0.1);border-color:var(--border2);color:var(--green)}

  /* OPCOES */
  .opcoes-wrap{display:flex;flex-direction:column;gap:6px}
  .opcao-row{display:flex;align-items:center;gap:8px}
  .opcao-radio{width:16px;height:16px;accent-color:var(--green);cursor:pointer;flex-shrink:0}
  .opcao-input{flex:1;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--white);font-size:12px;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s}
  .opcao-input:focus{border-color:var(--green)}
  .opcao-input::placeholder{color:var(--t1)}
  .btn-remove-sm{background:transparent;border:none;color:var(--t2);cursor:pointer;font-size:14px;padding:0;transition:color .15s}
  .btn-remove-sm:hover{color:var(--red)}
  .add-opcao-btn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--green);background:transparent;border:1px dashed var(--border2);border-radius:7px;padding:6px 12px;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s;width:fit-content}
  .add-opcao-btn:hover{background:rgba(147,245,116,0.04)}
  .sim-nao-wrap{display:flex;gap:10px}
  .sim-nao-opt{display:flex;align-items:center;gap:8px;background:rgba(0,0,0,0.15);border:1px solid var(--border);border-radius:8px;padding:8px 14px;cursor:pointer;transition:all .15s;flex:1;justify-content:center}
  .sim-nao-opt.correta{background:rgba(147,245,116,0.1);border-color:var(--border2)}
  .sim-nao-opt input{accent-color:var(--green)}
  .sim-nao-opt span{font-size:13px;font-weight:500}

  /* CRITERIOS */
  .notas-grid{display:flex;flex-direction:column;gap:8px}
  .nota-row{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center}
  .nota-label{width:48px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
  .nota-0{background:rgba(103,138,136,0.1);color:var(--t2)}
  .nota-1{background:rgba(229,91,91,0.15);color:#E55B5B}
  .nota-2{background:rgba(246,195,67,0.15);color:#F6C343}
  .nota-3{background:rgba(103,138,136,0.2);color:var(--mist)}
  .nota-4{background:rgba(100,200,150,0.15);color:#64C896}
  .nota-5{background:rgba(147,245,116,0.15);color:var(--green)}
  .nota-input{background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:8px;padding:8px 12px;color:var(--white);font-size:13px;font-family:'Inter',sans-serif;outline:none;width:100%;transition:border-color .2s}
  .nota-input:focus{border-color:var(--green)}
  .nota-input::placeholder{color:var(--t1)}
  .btn-sugerir{background:rgba(147,245,116,0.07);border:1px solid var(--border2);border-radius:8px;padding:7px 14px;font-size:12px;color:var(--green);font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
  .btn-sugerir:hover{background:rgba(147,245,116,0.14)}

  /* GABARITO */
  .gabarito-label{font-size:11px;color:var(--yellow);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .gabarito-input{width:100%;background:rgba(246,195,67,0.05);border:1px solid rgba(246,195,67,0.2);border-radius:8px;padding:9px 12px;color:var(--white);font-size:12px;font-family:'Inter',sans-serif;outline:none;resize:none;min-height:56px;line-height:1.6;transition:border-color .2s}
  .gabarito-input:focus{border-color:rgba(246,195,67,0.5)}
  .gabarito-input::placeholder{color:var(--t1)}

  /* ETAPA 4 PONTUAÇÃO */
  .valor-total-wrap{display:flex;align-items:flex-end;gap:16px;margin-bottom:28px;flex-wrap:wrap}
  .btn-distribuir{background:rgba(147,245,116,0.08);border:1px solid var(--border2);border-radius:10px;padding:10px 18px;font-size:13px;color:var(--green);font-family:'Inter',sans-serif;cursor:pointer;transition:all .15s;white-space:nowrap}
  .btn-distribuir:hover{background:rgba(147,245,116,0.15)}
  .peso-table{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;margin-bottom:16px}
  .peso-table-header{display:grid;grid-template-columns:1fr 160px 100px;padding:10px 20px;background:rgba(0,0,0,0.15);font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border)}
  .peso-row{display:grid;grid-template-columns:1fr 160px 100px;padding:12px 20px;border-bottom:1px solid var(--border);align-items:center}
  .peso-row:last-child{border-bottom:none}
  .peso-row-label{font-size:13px;color:var(--white);line-height:1.4}
  .peso-row-tipo{padding:0 8px}
  .tipo-pill{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(255,255,255,0.05);color:var(--t2);border:1px solid var(--border)}
  .peso-row-input{display:flex;justify-content:flex-end}
  .peso-input{width:80px;background:rgba(0,0,0,0.2);border:1px solid var(--border);border-radius:8px;padding:7px 10px;color:var(--white);font-size:14px;font-weight:600;font-family:'Inter',sans-serif;outline:none;text-align:center;transition:border-color .2s}
  .peso-input:focus{border-color:var(--green)}
  .soma-wrap{border-radius:10px;padding:12px 18px;font-size:13px;line-height:1.5;border:1px solid}
  .soma-wrap.ok{background:rgba(147,245,116,0.06);border-color:var(--border2);color:var(--green)}
  .soma-wrap.over{background:rgba(229,91,91,0.06);border-color:rgba(229,91,91,0.3);color:var(--red)}
  .soma-wrap.under{background:rgba(246,195,67,0.06);border-color:rgba(246,195,67,0.3);color:var(--yellow)}
  .soma-wrap strong{color:var(--white)}

  .toggle-row{display:flex;align-items:flex-start;gap:12px;cursor:pointer;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,0.1);transition:border-color .15s}
  .toggle-row:hover{border-color:var(--border2)}
  .toggle-box{width:36px;height:20px;border-radius:99px;background:rgba(255,255,255,0.1);border:1px solid var(--border);position:relative;flex-shrink:0;transition:all .2s;margin-top:2px}
  .toggle-box.active{background:rgba(147,245,116,0.3);border-color:var(--green)}
  .toggle-knob{width:14px;height:14px;border-radius:50%;background:var(--t2);position:absolute;top:2px;left:2px;transition:all .2s}
  .toggle-box.active .toggle-knob{left:18px;background:var(--green)}
  .toggle-info{flex:1}
  .toggle-label{font-size:12px;font-weight:500;color:var(--white);display:block;margin-bottom:2px}
  .toggle-desc{font-size:11px;color:var(--t2);line-height:1.4}
  .footer-bar{position:fixed;bottom:0;left:0;right:0;background:var(--dark);border-top:1px solid var(--border);padding:14px 48px;display:flex;justify-content:space-between;align-items:center;z-index:10}
  .footer-info{font-size:12px;color:var(--t2)}
  .footer-info strong{color:var(--green)}
  .footer-btns{display:flex;gap:10px}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#011918;border:1px solid var(--border2);border-radius:12px;padding:12px 24px;font-size:13px;color:var(--green);display:none;z-index:9999;box-shadow:0 8px 32px rgba(0,0,0,0.6);pointer-events:none;white-space:nowrap}

  @media(max-width:640px){
    .hdr,.steps-bar,.footer-bar{padding-left:20px;padding-right:20px}
    .content{padding:28px 20px 100px}
    .fg-row{grid-template-columns:1fr}
    .step-label{display:none}
    .step-divider{width:16px}
    .tipos-explicacao .tipo-card{flex-direction:column;align-items:flex-start}
  }
</style>
</head>
<body>

<header class="hdr">
  <div class="logo-area">
    <div class="logo-mark"><svg viewBox="0 0 18 18" fill="none"><rect x="2" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="2" width="6" height="6" rx="1.5" fill="#002726"/><rect x="2" y="10" width="6" height="6" rx="1.5" fill="#002726"/><rect x="10" y="10" width="6" height="6" rx="1.5" fill="#002726" opacity=".4"/></svg></div>
    <span class="logo-name">Bling <span>Seletivo</span></span>
  </div>
  <div class="hdr-right">
    <button class="btn-s" onclick="window.location.href='painel.html'">← Painel</button>
  </div>
</header>

<div class="steps-bar">
  <div class="step-item" onclick="irPara(1)"><div class="step-num active" id="sn-1">1</div><span class="step-label active" id="sl-1">Informações</span></div>
  <div class="step-divider"></div>
  <div class="step-item" onclick="irPara(2)"><div class="step-num pending" id="sn-2">2</div><span class="step-label pending" id="sl-2">Cenários e questões</span></div>
  <div class="step-divider"></div>
  <div class="step-item" onclick="irPara(3)"><div class="step-num pending" id="sn-3">3</div><span class="step-label pending" id="sl-3">Avaliação</span></div>
  <div class="step-divider"></div>
  <div class="step-item" onclick="irPara(4)"><div class="step-num pending" id="sn-4">4</div><span class="step-label pending" id="sl-4">Pontuação</span></div>
</div>

<div class="content" id="content"></div>

<div class="footer-bar">
  <div class="footer-info" id="footer-info"></div>
  <div class="footer-btns">
    <button class="btn-s" id="btn-anterior" onclick="anterior()" style="display:none">← Anterior</button>
    <button class="btn-s" id="btn-salvar" onclick="salvarRascunho()">💾 Salvar rascunho</button>
    <button class="btn-p" id="btn-proximo" onclick="proximo()">Próximo →</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, addDoc, collection, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxWXwMe3rE1zMSiIxmz5E34cc2BmyeGsw",
    authDomain: "bling-seletivo.firebaseapp.com",
    projectId: "bling-seletivo",
    storageBucket: "bling-seletivo.firebasestorage.app",
    messagingSenderId: "680949628238",
    appId: "1:680949628238:web:6e74791e02b69a1333321f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  let currentUser = null;
  let processId = new URLSearchParams(window.location.search).get('p');
  let etapa = 1;

  // bloco: { tipo:'cenario'|'questao', title, context, perguntas:[{ texto, tipo:'dissertativa'|'multipla'|'simnao', opcoes:[{texto,correta}], gabarito, criteria:[{score,description}], peso }] }
  let dados = { title:'', role:'', area:'', deadline:'', blocos:[], valorTotal:10 };

  onAuthStateChanged(auth, async user => {
    if (!user) { window.location.href = 'index.html'; return; }
    currentUser = user;
    if (processId) await carregarProcesso();
    renderEtapa(1);
  });

  async function carregarProcesso() {
    try {
      const snap = await getDoc(doc(db, 'processes', processId));
      if (snap.exists()) {
        const d = snap.data();
        dados.title    = d.title || '';
        dados.role     = d.role || '';
        dados.area     = d.area || '';
        dados.deadline = d.deadline ? new Date(d.deadline.seconds*1000).toISOString().split('T')[0] : '';
        dados.valorTotal = d.valorTotal || 10;
        if (d.blocos) {
          dados.blocos = d.blocos;
        } else if (d.scenarios) {
          dados.blocos = d.scenarios.map(sc => ({
            tipo:'cenario', title:sc.title, context:sc.context,
            perguntas:(sc.questions||[]).map(q=>({texto:q.text||'',tipo:'dissertativa',opcoes:[],gabarito:'',criteria:q.criteria||[],peso:null}))
          }));
        }
      }
    } catch(e) { console.error(e); }
  }

  // ══════════════════════════════════════════
  // ETAPA 1 — INFORMAÇÕES
  // ══════════════════════════════════════════

      <div class="fg-row">
        <div class="fg"><label>Cargo</label><input type="text" id="f-cargo" placeholder="Ex: Analista de Suporte L3" value="${esc(dados.role)}"></div>
        <div class="fg"><label>Área</label><input type="text" id="f-area" placeholder="Ex: Suporte Técnico" value="${esc(dados.area)}"></div>
      </div>
      <div class="fg" style="max-width:260px">
        <label>Prazo para entrega</label>
        <input type="date" id="f-prazo" value="${esc(dados.deadline)}">
      </div>`;
    document.getElementById('btn-anterior').style.display='none';
    document.getElementById('btn-proximo').textContent='Próximo →';
    document.getElementById('footer-info').innerHTML='Etapa <strong>1 de 4</strong> — Informações básicas';

  function coletarEtapa1() {
    dados.title    = document.getElementById('f-titulo')?.value.trim() || dados.title;
    dados.role     = document.getElementById('f-cargo')?.value.trim()  || dados.role;
    dados.area     = document.getElementById('f-area')?.value.trim()   || dados.area;
    dados.deadline = document.getElementById('f-prazo')?.value         || dados.deadline;
  }

  // ══════════════════════════════════════════
  // ETAPA 2 — ESTRUTURA (só texto das perguntas)
  // ══════════════════════════════════════════

    c.innerHTML = `
      <h2 class="sec-title">Cenários e questões</h2>
      <p class="sec-sub">Monte a estrutura do processo. Adicione os cenários e questões com seus textos — o tipo de resposta e critérios serão configurados no próximo passo.</p>

            <div class="tipo-card-desc">Apresenta um contexto ou situação, seguido de uma ou mais perguntas. Ideal para avaliar raciocínio em casos reais.</div>
          </div>
          <button class="add-bloco-btn-inline" onclick="adicionarBloco('cenario')">+ Adicionar cenário</button>
        </div>
        <div class="tipo-card">
          <div class="tipo-card-icon">❓</div>
          <div class="tipo-card-info">
            <div class="tipo-card-titulo">Questão avulsa</div>
            <div class="tipo-card-desc">Uma pergunta direta, sem contexto. Útil para verificar conhecimentos técnicos pontuais.</div>
          </div>
          <button class="add-bloco-btn-inline questao" onclick="adicionarBloco('questao')">+ Adicionar questão</button>
        </div>
      </div>
      <div id="blocos-lista"></div>
      <div id="add-mais" style="display:none">
        <div class="add-bloco-row">
          <button class="add-bloco-btn" onclick="adicionarBloco('cenario')">+ Cenário</button>
          <button class="add-bloco-btn questao" onclick="adicionarBloco('questao')">+ Questão avulsa</button>
        </div>
      </div>`;
    renderBlocos();
    document.getElementById('btn-anterior').style.display='inline-flex';
    document.getElementById('btn-proximo').textContent='Próximo →';
    atualizarFooter2();
  }

  function renderBlocos() {
    const lista = document.getElementById('blocos-lista');
    if (!lista) return;
    lista.innerHTML = dados.blocos.map((bl, bi) => {
      const isCenario = bl.tipo === 'cenario';
      return `
        <div class="bloco-card" id="bl-${bi}">
          <div class="bloco-header" onclick="toggleBloco(${bi})">
            <div class="bloco-header-left">
              <span class="bloco-tipo-badge ${isCenario?'badge-cenario':'badge-questao'}">${isCenario?'Cenário':'Questão'}</span>
              <span class="bloco-titulo-preview" id="bprev-${bi}">${esc(bl.title)||'Sem título'}</span>
            </div>
            <div class="bloco-header-right">
              <button class="btn-del" onclick="event.stopPropagation();removerBloco(${bi})">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M1.75 3.5h10.5M5.25 3.5V2.333a.583.583 0 0 1 .583-.583h2.334a.583.583 0 0 1 .583.583V3.5M11.083 3.5l-.583 7.583a.583.583 0 0 1-.583.584H4.083a.583.583 0 0 1-.583-.584L2.917 3.5" stroke="#E55B5B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.833 6.417v2.916M8.167 6.417v2.916" stroke="#E55B5B" stroke-width="1.2" stroke-linecap="round"/></svg>
              </button>
              <span class="chevron open" id="bchev-${bi}">▾</span>
            </div>
          </div>
          <div class="bloco-body open" id="bb-${bi}">
            <div style="padding-top:16px">
              <div class="fg">
                <label>${isCenario?'Título do cenário':'Título da questão'}</label>
                <input type="text" id="bl-title-${bi}"
                  placeholder="${isCenario?'Ex: Triagem de Ouvidoria':'Ex: Você tem familiaridade com N8N?'}"
                  value="${esc(bl.title)}"
                  oninput="dados.blocos[${bi}].title=this.value;document.getElementById('bprev-${bi}').textContent=this.value||'Sem título'">
              </div>
              ${!isCenario ? `
              <div class="perg-tipo-row" style="margin-top:12px">
                <span class="perg-tipo-label">Tipo de resposta:</span>
                <button class="perg-tipo-btn ${(bl.perguntas[0]?.tipo||'dissertativa')==='dissertativa'?'active':''}" onclick="setTipoPergEtapa2(${bi},0,'dissertativa')">✍ Dissertativa</button>
                <button class="perg-tipo-btn ${(bl.perguntas[0]?.tipo||'dissertativa')==='multipla'?'active':''}" onclick="setTipoPergEtapa2(${bi},0,'multipla')">☑ Múltipla escolha</button>
                <button class="perg-tipo-btn ${(bl.perguntas[0]?.tipo||'dissertativa')==='simnao'?'active':''}" onclick="setTipoPergEtapa2(${bi},0,'simnao')">◉ Sim / Não</button>
              </div>
              <div id="e2-opcoes-${bi}-0" style="margin-top:10px">
                ${renderE2Opcoes(bi,0,bl.perguntas[0])}
              </div>
              ${(bl.perguntas[0]?.tipo||'dissertativa')!=='dissertativa'?renderTogglesSel(bi,0,bl.perguntas[0]):''}
              ` : ''}
              ${isCenario ? `
              <div class="fg">
                <label>Contexto / situação</label>
                <textarea id="bl-ctx-${bi}" placeholder="Descreva a situação…" rows="3"
                  oninput="dados.blocos[${bi}].context=this.value">${esc(bl.context||'')}</textarea>
              </div>
              <div style="margin-top:4px">
                <div style="font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Perguntas</div>
                <div id="pergs-${bi}">
                  ${bl.perguntas.map((p,pi) => {
                    const tipo = p.tipo||'dissertativa';
                    return `
                    <div class="perg-simples" id="pq-${bi}-${pi}" style="flex-direction:column;gap:8px">
                      <div style="display:flex;gap:10px;align-items:flex-start;width:100%">
                        <div class="perg-num">${pi+1}</div>
                        <textarea class="perg-input" rows="2" placeholder="Escreva a pergunta…"
                          oninput="dados.blocos[${bi}].perguntas[${pi}].texto=this.value">${esc(p.texto)}</textarea>
                        ${bl.perguntas.length > 1 ? `<button class="btn-remove" onclick="removerPergunta(${bi},${pi})">×</button>` : ''}
                      </div>
                      <div class="perg-tipo-row" style="padding-left:34px">
                        <span class="perg-tipo-label">Tipo:</span>
                        <button class="perg-tipo-btn ${tipo==='dissertativa'?'active':''}" onclick="setTipoPergEtapa2(${bi},${pi},'dissertativa')">✍ Dissertativa</button>
                        <button class="perg-tipo-btn ${tipo==='multipla'?'active':''}" onclick="setTipoPergEtapa2(${bi},${pi},'multipla')">☑ Múltipla escolha</button>
                        <button class="perg-tipo-btn ${tipo==='simnao'?'active':''}" onclick="setTipoPergEtapa2(${bi},${pi},'simnao')">◉ Sim / Não</button>
                      </div>
                      <div id="e2-opcoes-${bi}-${pi}" style="padding-left:34px">
                        ${renderE2Opcoes(bi,pi,p)}
                      </div>
                      ${tipo!=='dissertativa'?renderTogglesSel(bi,pi,p):''}
                    </div>`}).join('')}
                </div>
                <button class="add-perg-btn" onclick="adicionarPergunta(${bi})">+ Adicionar pergunta</button>
              </div>` : ''}
            </div>
          </div>
        </div>`;
    }).join('');
    const addMais = document.getElementById('add-mais');
    if (addMais) addMais.style.display = dados.blocos.length > 0 ? 'block' : 'none';
  }

  function renderE2Opcoes(bi, pi, p) {
    const tipo = p.tipo || 'dissertativa';
    if (tipo === 'dissertativa') return '';
    if (tipo === 'simnao') {
      const correta = p.opcoes?.[0]?.correta ? 'sim' : p.opcoes?.[1]?.correta ? 'nao' : '';
      return `<div style="margin-top:8px">
        <div style="font-size:11px;color:var(--t2);margin-bottom:6px">Marque a resposta correta:</div>
        <div class="sim-nao-wrap">
          <div class="sim-nao-opt ${correta==='sim'?'correta':''}" onclick="setSimNaoE2(${bi},${pi},'sim')">
            <input type="radio" name="sn2-${bi}-${pi}" ${correta==='sim'?'checked':''} readonly><span>Sim</span>
          </div>
          <div class="sim-nao-opt ${correta==='nao'?'correta':''}" onclick="setSimNaoE2(${bi},${pi},'nao')">
            <input type="radio" name="sn2-${bi}-${pi}" ${correta==='nao'?'checked':''} readonly><span>Não</span>
          </div>
        </div>
      </div>`;
    }
    if (tipo === 'multipla') {
      const opcoes = p.opcoes && p.opcoes.length ? p.opcoes : [{texto:'',correta:true},{texto:'',correta:false}];
      if (!p.opcoes || p.opcoes.length === 0) dados.blocos[bi].perguntas[pi].opcoes = opcoes;
      return `<div style="margin-top:8px">
        <div style="font-size:11px;color:var(--t2);margin-bottom:6px">Opções — selecione ● a correta:</div>
        <div class="opcoes-wrap" id="e2-opc-${bi}-${pi}">
          ${opcoes.map((o,oi) => `
            <div class="opcao-row" id="e2-opc-row-${bi}-${pi}-${oi}">
              <input type="radio" class="opcao-radio" name="e2opc-${bi}-${pi}" ${o.correta?'checked':''} onclick="setOpcaoCorretaE2(${bi},${pi},${oi})">
              <input class="opcao-input" type="text" placeholder="Opção ${oi+1}…" value="${esc(o.texto)}"
                oninput="dados.blocos[${bi}].perguntas[${pi}].opcoes[${oi}].texto=this.value">
              ${opcoes.length > 2 ? `<button class="btn-remove-sm" onclick="removerOpcaoE2(${bi},${pi},${oi})">×</button>` : ''}
            </div>`).join('')}
        </div>
        <button class="add-opcao-btn" onclick="adicionarOpcaoE2(${bi},${pi})">+ Adicionar opção</button>
      </div>`;
    }
    return '';
  }

  window.setSimNaoE2 = (bi,pi,val) => {
    dados.blocos[bi].perguntas[pi].opcoes=[{texto:'Sim',correta:val==='sim'},{texto:'Não',correta:val==='nao'}];
    const wrap=document.getElementById(`e2-opcoes-${bi}-${pi}`);
    if(wrap) wrap.innerHTML=renderE2Opcoes(bi,pi,dados.blocos[bi].perguntas[pi]);
  };

  window.setOpcaoCorretaE2 = (bi,pi,oi) => {
    dados.blocos[bi].perguntas[pi].opcoes.forEach((o,i)=>o.correta=i===oi);
  };

  window.adicionarOpcaoE2 = (bi,pi) => {
    coletarOpcoes();
    dados.blocos[bi].perguntas[pi].opcoes.push({texto:'',correta:false});
    const wrap=document.getElementById(`e2-opcoes-${bi}-${pi}`);
    if(wrap) wrap.innerHTML=renderE2Opcoes(bi,pi,dados.blocos[bi].perguntas[pi]);
  };

  window.removerOpcaoE2 = (bi,pi,oi) => {
    coletarOpcoes();
    dados.blocos[bi].perguntas[pi].opcoes.splice(oi,1);
    const wrap=document.getElementById(`e2-opcoes-${bi}-${pi}`);
    if(wrap) wrap.innerHTML=renderE2Opcoes(bi,pi,dados.blocos[bi].perguntas[pi]);
  };

  function coletarOpcoes() {
    dados.blocos.forEach((bl,bi) => {
      bl.perguntas.forEach((p,pi) => {
        if (p.tipo==='multipla' && p.opcoes) {
          p.opcoes.forEach((o,oi) => {
            const inp = document.querySelector(`#e2-opc-row-${bi}-${pi}-${oi} .opcao-input`);
            if (inp) o.texto = inp.value;
          });
        }
      });
    });
  }

  function renderTogglesSel(bi, pi, p) {
    const temJust = p.justificativa || false;
    const autoCorr = p.autoCorrigir !== false; // padrão true
    return `<div style="padding-left:34px;margin-top:10px;display:flex;flex-direction:column;gap:8px">
      <label class="toggle-row" onclick="toggleJustificativa(${bi},${pi})">
        <div class="toggle-box ${temJust?'active':''}">
          <div class="toggle-knob"></div>
        </div>
        <div class="toggle-info">
          <span class="toggle-label">Solicitar justificativa do candidato</span>
          <span class="toggle-desc">Candidato escreve o raciocínio além de selecionar a opção</span>
        </div>
      </label>
      <label class="toggle-row" onclick="toggleAutoCorrigir(${bi},${pi})">
        <div class="toggle-box ${autoCorr?'active':''}">
          <div class="toggle-knob"></div>
        </div>
        <div class="toggle-info">
          <span class="toggle-label">Corrigir automaticamente pela opção selecionada</span>
          <span class="toggle-desc">Acertou = pontos cheios · Errou = 0 · ${temJust&&!autoCorr?'Avaliação manual pela justificativa':'Sem avaliação manual'}</span>
        </div>
      </label>
    </div>`;
  }

  window.toggleJustificativa = (bi, pi) => {
    dados.blocos[bi].perguntas[pi].justificativa = !dados.blocos[bi].perguntas[pi].justificativa;
    renderBlocos();
    document.getElementById(`bb-${bi}`)?.classList.add('open');
  };

  window.toggleAutoCorrigir = (bi, pi) => {
    const p = dados.blocos[bi].perguntas[pi];
    p.autoCorrigir = p.autoCorrigir === false ? true : false;
    renderBlocos();
    document.getElementById(`bb-${bi}`)?.classList.add('open');
  };

  function atualizarFooter2() {
    document.getElementById('footer-info').innerHTML=`Etapa <strong>2 de 4</strong> — <strong>${dados.blocos.length}</strong> bloco(s)`;
  }

  window.setTipoPergEtapa2 = (bi, pi, tipo) => {
    coletarBlocos();
    const p = dados.blocos[bi].perguntas[pi];
    p.tipo = tipo;
    if (tipo==='multipla' && (!p.opcoes||p.opcoes.length===0)) p.opcoes=[{texto:'',correta:true},{texto:'',correta:false}];
    if (tipo==='simnao') p.opcoes=[{texto:'Sim',correta:false},{texto:'Não',correta:false}];
    if (tipo==='dissertativa') p.opcoes=[];
    // Atualiza botões ativos
    ['dissertativa','multipla','simnao'].forEach(t => {
      const btn = document.querySelector(`[onclick="setTipoPergEtapa2(${bi},${pi},'${t}')"]`);
      if (btn) btn.classList.toggle('active', t===tipo);
    });
    // Atualiza opções inline sem re-renderizar tudo
    const wrap = document.getElementById(`e2-opcoes-${bi}-${pi}`);
    if (wrap) wrap.innerHTML = renderE2Opcoes(bi,pi,p);
  };

  window.toggleBloco = bi => {
    document.getElementById(`bb-${bi}`)?.classList.toggle('open');
    document.getElementById(`bchev-${bi}`)?.classList.toggle('open');
  };

  window.adicionarBloco = tipo => {
    coletarBlocos();
    dados.blocos.push(tipo==='cenario'
      ? {tipo:'cenario',title:'',context:'',perguntas:[{texto:'',tipo:'dissertativa',opcoes:[],gabarito:'',criteria:[],peso:null}]}
      : {tipo:'questao',title:'',context:'',perguntas:[{texto:'',tipo:'dissertativa',opcoes:[],gabarito:'',criteria:[],peso:null}]});
    renderBlocos(); atualizarFooter2();
  };

  window.removerBloco = bi => {
    if (dados.blocos.length === 1) { toast('Precisa ter ao menos um bloco.'); return; }
    if (!confirm('Remover este bloco?')) return;
    coletarBlocos(); dados.blocos.splice(bi,1); renderBlocos(); atualizarFooter2();
  };

  window.adicionarPergunta = bi => {
    coletarBlocos();
    dados.blocos[bi].perguntas.push({texto:'',tipo:'dissertativa',opcoes:[],gabarito:'',criteria:[],peso:null});
    renderBlocos();
    document.getElementById(`bb-${bi}`)?.classList.add('open');
  };

  window.removerPergunta = (bi,pi) => {
    if (dados.blocos[bi].perguntas.length === 1) { toast('Precisa ter ao menos uma pergunta.'); return; }
    coletarBlocos(); dados.blocos[bi].perguntas.splice(pi,1); renderBlocos();
    document.getElementById(`bb-${bi}`)?.classList.add('open');
  };

  function coletarBlocos() {
    dados.blocos.forEach((bl,bi) => {
      bl.title   = document.getElementById(`bl-title-${bi}`)?.value ?? bl.title;
      bl.context = document.getElementById(`bl-ctx-${bi}`)?.value   ?? bl.context;
      bl.perguntas.forEach((p,pi) => {
        if (bl.tipo === 'questao') { p.texto = bl.title; }
        else {
          const el = document.getElementById(`pq-${bi}-${pi}`)?.querySelector('textarea.perg-input');
          if (el) p.texto = el.value;
        }
        // Coletar opções de texto
        if (p.tipo==='multipla' && p.opcoes) {
          p.opcoes.forEach((o,oi) => {
            const inp = document.querySelector(`#e2-opc-row-${bi}-${pi}-${oi} .opcao-input`);
            if (inp) o.texto = inp.value;
          });
        }
      });
    });
  }

  // ══════════════════════════════════════════
  // ETAPA 3 — AVALIAÇÃO (tipo, opções, critérios, gabarito)
  // ══════════════════════════════════════════
  function renderEtapa3() {
    const c = document.getElementById('content');
    let html = `
      <h2 class="sec-title">Avaliação</h2>
      <p class="sec-sub">Para cada pergunta defina o tipo de resposta, marque a correta (seleção) ou configure os critérios de avaliação (dissertativa).</p>`;

    dados.blocos.forEach((bl, bi) => {
      bl.perguntas.forEach((p, pi) => {
        const tipo = p.tipo || 'dissertativa';
        const label = bl.tipo==='cenario'
          ? `Cenário ${bi+1} — ${bl.title||'Sem título'}${bl.perguntas.length>1?' · Pergunta '+(pi+1):''}`
          : `Questão ${bi+1} — ${bl.title||'Sem título'}`;
        const pergTxt = bl.tipo==='questao' ? bl.title : p.texto;

        html += `<div class="aval-block">
          <div class="aval-header">
            <div>
              <div class="aval-perg-num">${esc(label)}</div>
              <div class="aval-perg-txt">${esc(pergTxt||'Sem texto')}</div>
            </div>
          </div>
          <div class="aval-body">
            <div class="tipo-selector-row">
              <span class="tipo-sel-label">Tipo:</span>
              <button class="tipo-sel-btn ${tipo==='dissertativa'?'active':''}" onclick="setTipo(${bi},${pi},'dissertativa')">✍ Dissertativa</button>
              <button class="tipo-sel-btn ${tipo==='multipla'?'active':''}" onclick="setTipo(${bi},${pi},'multipla')">☑ Múltipla escolha</button>
              <button class="tipo-sel-btn ${tipo==='simnao'?'active':''}" onclick="setTipo(${bi},${pi},'simnao')">◉ Sim / Não</button>
            </div>
            <div id="aval-opcoes-${bi}-${pi}">${renderAvalOpcoes(bi,pi,p)}</div>
          </div>
        </div>`;
      });
    });

    c.innerHTML = html;
    document.getElementById('btn-anterior').style.display='inline-flex';
    document.getElementById('btn-proximo').textContent='Próximo →';
    document.getElementById('footer-info').innerHTML='Etapa <strong>3 de 4</strong> — Avaliação';
  }

  function renderAvalOpcoes(bi, pi, p) {
    const tipo = p.tipo || 'dissertativa';
    const autoCorr = p.autoCorrigir !== false; // padrão true
    const temJust = p.justificativa || false;
    const precisaCriterios = tipo === 'dissertativa' || (!autoCorr); // precisa de critérios se dissertativa OU se correção manual
    let html = '';

    if (tipo === 'simnao' || tipo === 'multipla') {
      const correta = p.opcoes?.find(o=>o.correta)?.texto || '—';
      // Sempre mostrar qual é a resposta correta
      html += `<div style="padding:12px 16px;background:rgba(147,245,116,0.05);border:1px solid var(--border2);border-radius:10px;font-size:13px;color:var(--green);margin-bottom:12px">
        ✅ Resposta correta: <strong style="color:var(--white);margin-left:4px">${esc(correta)}</strong>
        ${!autoCorr ? '<span style="color:var(--yellow);margin-left:8px;font-size:11px">· Avaliação manual ativa</span>' : ''}
      </div>`;
    }

    if (precisaCriterios) {
      // Mostrar critérios 0-5
      html += `<div>
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
          <span style="font-size:12px;color:var(--t2);text-transform:uppercase;letter-spacing:.05em">Critérios de avaliação (0 a 5)</span>
          <button class="btn-sugerir" onclick="sugerirCriterios(${bi},${pi})">✨ Sugerir</button>
        </div>
        <div class="notas-grid">
          ${[0,1,2,3,4,5].map(n => {
            const val = p.criteria?.find(cr=>cr.score===n)?.description||'';
            return `<div class="nota-row">
              <div class="nota-label nota-${n}">${n}</div>
              <input class="nota-input" type="text" id="crit-${bi}-${pi}-${n}"
                placeholder="${placeholderNota(n)}" value="${esc(val)}"
                oninput="salvarCriterio(${bi},${pi},${n},this.value)">
            </div>`;
          }).join('')}
        </div>
      </div>`;
    }

    // Gabarito sempre disponível
    html += `<div style="margin-top:${precisaCriterios?'14px':'0'}">
      <div class="gabarito-label">📋 ${tipo==='dissertativa'?'Gabarito / resposta esperada':'Gabarito / observação adicional (opcional)'}</div>
      <textarea class="gabarito-input" id="gab-${bi}-${pi}"
        placeholder="${tipo==='dissertativa'?'Descreva a resposta ideal para esta pergunta…':'Adicione uma explicação ou contexto sobre a resposta correta…'}"
        oninput="dados.blocos[${bi}].perguntas[${pi}].gabarito=this.value" rows="${tipo==='dissertativa'?3:2}">${esc(p.gabarito||'')}</textarea>
    </div>`;

    return html;
  }

  window.setTipo = (bi, pi, tipo) => {
    coletarAvalOpcoes();
    const p = dados.blocos[bi].perguntas[pi];
    p.tipo = tipo;
    if (tipo==='multipla' && (!p.opcoes||p.opcoes.length===0)) p.opcoes=[{texto:'',correta:true},{texto:'',correta:false}];
    if (tipo==='simnao') p.opcoes=[{texto:'Sim',correta:false},{texto:'Não',correta:false}];
    if (tipo==='dissertativa') p.opcoes=[];
    // Atualiza botões de tipo
    const bloco = dados.blocos[bi];
    bloco.perguntas.forEach((_,i) => {
      ['dissertativa','multipla','simnao'].forEach(t => {
        const btn = document.querySelector(`[onclick="setTipo(${bi},${i},'${t}')"]`);
        if (btn) btn.classList.toggle('active', t===tipo && i===pi);
      });
    });
    const wrap = document.getElementById(`aval-opcoes-${bi}-${pi}`);
    if (wrap) wrap.innerHTML = renderAvalOpcoes(bi, pi, p);
  };

  window.setSimNao = (bi,pi,val) => {
    dados.blocos[bi].perguntas[pi].opcoes=[{texto:'Sim',correta:val==='sim'},{texto:'Não',correta:val==='nao'}];
    const wrap = document.getElementById(`aval-opcoes-${bi}-${pi}`);
    if (wrap) wrap.innerHTML = renderAvalOpcoes(bi,pi,dados.blocos[bi].perguntas[pi]);
  };

  window.setOpcaoCorreta = (bi,pi,oi) => {
    dados.blocos[bi].perguntas[pi].opcoes.forEach((o,i) => o.correta=i===oi);
  };

  window.adicionarOpcao = (bi,pi) => {
    coletarAvalOpcoes();
    dados.blocos[bi].perguntas[pi].opcoes.push({texto:'',correta:false});
    const wrap = document.getElementById(`aval-opcoes-${bi}-${pi}`);
    if (wrap) wrap.innerHTML = renderAvalOpcoes(bi,pi,dados.blocos[bi].perguntas[pi]);
  };

  window.removerOpcao = (bi,pi,oi) => {
    coletarAvalOpcoes();
    dados.blocos[bi].perguntas[pi].opcoes.splice(oi,1);
    const wrap = document.getElementById(`aval-opcoes-${bi}-${pi}`);
    if (wrap) wrap.innerHTML = renderAvalOpcoes(bi,pi,dados.blocos[bi].perguntas[pi]);
  };

  function coletarAvalOpcoes() {
    dados.blocos.forEach((bl,bi) => {
      bl.perguntas.forEach((p,pi) => {
        if (p.tipo==='multipla' && p.opcoes) {
          p.opcoes.forEach((o,oi) => {
            const inp = document.querySelector(`#opc-row-${bi}-${pi}-${oi} .opcao-input`);
            if (inp) o.texto = inp.value;
          });
        }
        const gab = document.getElementById(`gab-${bi}-${pi}`);
        if (gab) p.gabarito = gab.value;
      });
    });
  }

  const SUGERIDOS = {1:'Resposta muito superficial, sem demonstrar compreensão do problema.',2:'Identifica o problema mas a abordagem é incompleta ou sem justificativa.',3:'Resposta adequada com raciocínio claro, atende ao esperado para a vaga.',4:'Resposta completa, bem estruturada, com exemplos práticos.',5:'Resposta excepcional — demonstra domínio total, visão estratégica e proatividade.'};

  window.sugerirCriterios = (bi,pi) => {
    const btn = document.querySelector(`[onclick="sugerirCriterios(${bi},${pi})"]`);
    if (btn){btn.textContent='✓ Aplicado!';setTimeout(()=>btn.textContent='✨ Sugerir',2000);}
    [1,2,3,4,5].forEach(n=>{
      const inp=document.getElementById(`crit-${bi}-${pi}-${n}`);
      if(inp){inp.value=SUGERIDOS[n];salvarCriterio(bi,pi,n,SUGERIDOS[n]);}
    });
  };

  window.salvarCriterio = (bi,pi,score,desc) => {
    let crit = dados.blocos[bi].perguntas[pi].criteria||[];
    const idx=crit.findIndex(c=>c.score===score);
    if(idx>=0) crit[idx].description=desc; else crit.push({score,description:desc});
    dados.blocos[bi].perguntas[pi].criteria=crit;
  };

  function placeholderNota(n){return{0:'Não respondeu ou completamente fora do contexto…',1:'Resposta muito superficial…',2:'Identifica o problema mas incompleto…',3:'Resposta adequada com raciocínio claro…',4:'Resposta completa com exemplos práticos…',5:'Resposta excepcional, demonstra domínio total…'}[n];}

  // ══════════════════════════════════════════
  // ETAPA 4 — PONTUAÇÃO
  // ══════════════════════════════════════════
  function renderEtapa4() {
    const c = document.getElementById('content');
    let pergsList = '';
    dados.blocos.forEach((bl,bi) => {
      bl.perguntas.forEach((p,pi) => {
        const label = bl.tipo==='cenario'
          ? `Cenário ${bi+1}${bl.perguntas.length>1?' · P'+(pi+1):''} — ${bl.title||'Sem título'}`
          : `Questão ${bi+1} — ${bl.title||'Sem título'}`;
        const tipoPill = p.tipo==='dissertativa'?'Dissertativa':p.tipo==='multipla'?'Múltipla':'Sim/Não';
        pergsList += `
          <div class="peso-row">
            <div class="peso-row-label">${esc(label)}</div>
            <div class="peso-row-tipo"><span class="tipo-pill">${tipoPill}</span></div>
            <div class="peso-row-input">
              <input type="number" class="peso-input" id="peso-${bi}-${pi}"
                min="0" step="0.5" placeholder="0" value="${p.peso!=null?p.peso:''}"
                oninput="dados.blocos[${bi}].perguntas[${pi}].peso=parseFloat(this.value)||0;atualizarSoma()">
            </div>
          </div>`;
      });
    });

    c.innerHTML = `
      <h2 class="sec-title">Pontuação</h2>
      <p class="sec-sub">Defina o valor total da prova e distribua os pontos entre as perguntas.</p>
      <div class="valor-total-wrap">
        <div class="fg" style="max-width:200px;margin-bottom:0">
          <label>Valor total da prova</label>
          <input type="number" id="valor-total" min="1" step="0.5" placeholder="Ex: 10"
            value="${dados.valorTotal||10}"
            oninput="dados.valorTotal=parseFloat(this.value)||10;atualizarSoma()">
        </div>
        <button class="btn-distribuir" onclick="distribuirIgualmente()">⚖️ Distribuir igualmente</button>
      </div>
      <div class="peso-table">
        <div class="peso-table-header"><div>Pergunta</div><div>Tipo</div><div style="text-align:right">Pontos</div></div>
        ${pergsList}
      </div>
      <div class="soma-wrap" id="soma-wrap"><div id="soma-info"></div></div>`;

    document.getElementById('btn-anterior').style.display='inline-flex';
    document.getElementById('btn-proximo').textContent='✦ Salvar processo';
    document.getElementById('footer-info').innerHTML='Etapa <strong>4 de 4</strong> — Pontuação';
    atualizarSoma();
  }

  window.distribuirIgualmente = () => {
    const total = dados.valorTotal||10;
    const n = dados.blocos.reduce((acc,bl)=>acc+bl.perguntas.length,0);
    if (!n) return;
    const por = Math.round((total/n)*100)/100;
    dados.blocos.forEach((bl,bi) => bl.perguntas.forEach((p,pi) => {
      p.peso=por;
      const inp=document.getElementById(`peso-${bi}-${pi}`);
      if(inp) inp.value=por;
    }));
    atualizarSoma();
    toast('✅ Pontos distribuídos igualmente!');
  };

  window.atualizarSoma = () => {
    const total=dados.valorTotal||10;
    let soma=0;
    dados.blocos.forEach(bl=>bl.perguntas.forEach(p=>soma+=parseFloat(p.peso)||0));
    soma=Math.round(soma*100)/100;
    const diff=Math.round((soma-total)*100)/100;
    const wrap=document.getElementById('soma-wrap'),info=document.getElementById('soma-info');
    if(!wrap||!info)return;
    if(diff===0){wrap.className='soma-wrap ok';info.innerHTML=`✓ Soma: <strong>${soma}</strong> — igual ao valor total`;}
    else if(diff>0){wrap.className='soma-wrap over';info.innerHTML=`⚠️ Soma: <strong>${soma}</strong> — excede em <strong>${diff}</strong> ponto(s)`;}
    else{wrap.className='soma-wrap under';info.innerHTML=`⚠️ Soma: <strong>${soma}</strong> — faltam <strong>${Math.abs(diff)}</strong> ponto(s)`;}
  };

  // ══════════════════════════════════════════
  // NAVEGAÇÃO
  // ══════════════════════════════════════════
  window.renderEtapa = function(n) {
    etapa=n; atualizarSteps();
    if(n===1)renderEtapa1();
    else if(n===2)renderEtapa2();
    else if(n===3)renderEtapa3();
    else if(n===4)renderEtapa4();
  };

  window.proximo = () => {
    if(etapa===1){
      coletarEtapa1();
      if(!dados.title||!dados.role||!dados.area||!dados.deadline){toast('Preencha todos os campos.');return;}
      renderEtapa(2);
    } else if(etapa===2){
      coletarBlocos();
      if(dados.blocos.length===0){toast('Adicione ao menos um bloco.');return;}
      if(dados.blocos.some(b=>!b.title.trim())){toast('Todos os blocos precisam ter título.');return;}
      renderEtapa(3);
    } else if(etapa===3){
      coletarAvalOpcoes();
      renderEtapa(4);
    } else if(etapa===4){
      salvarProcesso();
    }
  };

  window.anterior = () => {
    if(etapa===2){coletarBlocos();renderEtapa(1);}
    else if(etapa===3){coletarAvalOpcoes();renderEtapa(2);}
    else if(etapa===4)renderEtapa(3);
  };

  window.irPara = n => {
    if(n>etapa)return;
    if(etapa===1)coletarEtapa1();
    if(etapa===2)coletarBlocos();
    if(etapa===3)coletarAvalOpcoes();
    renderEtapa(n);
  };

  function atualizarSteps(){
    [1,2,3,4].forEach(n=>{
      const num=document.getElementById(`sn-${n}`),lbl=document.getElementById(`sl-${n}`);
      if(!num)return;
      if(n<etapa){num.className='step-num done';num.textContent='✓';lbl.className='step-label active';}
      else if(n===etapa){num.className='step-num active';num.textContent=n;lbl.className='step-label active';}
      else{num.className='step-num pending';num.textContent=n;lbl.className='step-label pending';}
    });
  }

  // ══════════════════════════════════════════
  // SALVAR
  // ══════════════════════════════════════════
  window.salvarRascunho = async () => {
    if(etapa===1)coletarEtapa1();
    if(etapa===2)coletarBlocos();
    if(etapa===3)coletarAvalOpcoes();
    await salvarNoFirestore('draft');
    toast('✅ Rascunho salvo!');
  };

  async function salvarProcesso(){
    coletarAvalOpcoes();
    const btn=document.getElementById('btn-proximo');
    btn.disabled=true;btn.textContent='Salvando…';
    await salvarNoFirestore('draft');
    btn.disabled=false;btn.textContent='✦ Salvar processo';
    toast('✅ Processo salvo! Publique no painel quando estiver pronto.');
    setTimeout(()=>window.location.href='painel.html',2000);
  }

  async function salvarNoFirestore(status){
    if(!currentUser)return;
    try{
      const payload={
        ownerUid:currentUser.uid, ownerEmail:currentUser.email,
        title:dados.title, role:dados.role, area:dados.area,
        deadline:dados.deadline?new Date(dados.deadline+'T23:59:00'):null,
        status, blocos:dados.blocos, valorTotal:dados.valorTotal||10,
        scenarios:dados.blocos.map(bl=>({title:bl.title,context:bl.context||'',questions:bl.perguntas.map(p=>({text:p.texto,criteria:p.criteria||[]}))})),
        updatedAt:serverTimestamp(),
      };
      if(!processId){
        payload.createdAt=serverTimestamp();
        const ref=await addDoc(collection(db,'processes'),payload);
        processId=ref.id;
        window.history.replaceState({},'',`?p=${processId}`);
      } else {
        await setDoc(doc(db,'processes',processId),payload,{merge:true});
      }
    } catch(e){toast('Erro ao salvar: '+e.message);}
  }

  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
  function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
  window.toast=toast;
</script>
</body>
</html>
