<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bling Seletivo — Acesso</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{
    --dark:#002726;--green:#93F574;--t1:#40615E;--t2:#678A88;
    --mist:#B9C9C9;--mist2:#E3EBEB;--white:#FFFFFF;--card:#03302F;
    --border:rgba(147,245,116,0.15);--border2:rgba(147,245,116,0.3);
    --red:#E55B5B;
  }
  html,body{height:100%;font-family:'Inter',sans-serif;background:var(--dark);color:var(--white);-webkit-font-smoothing:antialiased}

  /* ── LAYOUT ── */
  .page{min-height:100vh;display:flex;flex-direction:column}

  /* ── HEADER ── */
  .hdr{height:68px;padding:0 48px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);flex-shrink:0}
  .logo-area{display:flex;align-items:center;gap:12px}
  .logo-mark{width:32px;height:32px;background:var(--green);border-radius:8px;display:flex;align-items:center;justify-content:center}
  .logo-mark svg{width:18px;height:18px}
  .logo-name{font-size:15px;font-weight:600;color:var(--white)}
  .logo-name span{color:var(--green)}
  .badge{font-size:12px;font-weight:500;color:var(--green);border:1px solid var(--border2);padding:5px 16px;border-radius:99px}

  /* ── MAIN ── */
  .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}

  /* ── CARD ── */
  .card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:44px 48px;width:100%;max-width:440px}

  .card-icon{width:48px;height:48px;background:rgba(147,245,116,0.1);border:1px solid var(--border2);border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;font-size:20px}

  .card-title{font-size:26px;font-weight:600;margin-bottom:6px}
  .card-sub{font-size:14px;color:var(--mist);margin-bottom:32px;line-height:1.6}

  /* ── FORM ── */
  .fg{margin-bottom:16px}
  .fg label{font-size:13px;color:var(--mist);margin-bottom:7px;display:block;font-weight:500}
  .fg input{
    width:100%;background:rgba(0,0,0,0.2);border:1px solid var(--border);
    border-radius:10px;padding:13px 16px;color:var(--white);font-size:14px;
    font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;
  }
  .fg input:focus{border-color:var(--green)}
  .fg input::placeholder{color:var(--t1)}

  /* ── ERRO ── */
  .err-box{
    background:rgba(229,91,91,0.08);border:1px solid rgba(229,91,91,0.25);
    border-radius:10px;padding:11px 14px;font-size:13px;color:var(--red);
    margin-bottom:16px;display:none;line-height:1.5;
  }

  /* ── BOTÃO ── */
  .btn-p{
    width:100%;background:var(--green);color:var(--dark);border:none;
    border-radius:12px;padding:14px;font-size:15px;font-weight:600;
    font-family:'Inter',sans-serif;cursor:pointer;transition:opacity .2s;
    margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .btn-p:hover{opacity:.88}
  .btn-p:disabled{opacity:.5;cursor:not-allowed}

  /* LOADING SPINNER */
  .spinner{width:16px;height:16px;border:2px solid rgba(0,39,38,0.3);border-top-color:var(--dark);border-radius:50%;animation:spin .7s linear infinite;display:none}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ── DIVIDER ── */
  .divider{display:flex;align-items:center;gap:12px;margin:24px 0}
  .divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border)}
  .divider span{font-size:11px;color:var(--t2);text-transform:uppercase;letter-spacing:.06em}

  /* ── INFO ── */
  .info-row{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);margin-top:24px;justify-content:center}
  .info-dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0}

  /* ── FOOTER ── */
  .footer{padding:20px 48px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
  .footer-left{font-size:12px;color:var(--t2)}
  .footer-right{font-size:12px;color:var(--t2)}

  /* ── ESTADO LOGANDO ── */
  .redirect-msg{text-align:center;padding:20px 0;display:none}
  .redirect-msg p{font-size:14px;color:var(--mist);margin-top:12px}

  /* ── DECORAÇÃO ── */
  .bg-glow{position:fixed;top:-200px;left:50%;transform:translateX(-50%);width:600px;height:400px;background:radial-gradient(ellipse,rgba(147,245,116,0.04) 0%,transparent 70%);pointer-events:none;z-index:0}
  .page{position:relative;z-index:1}
</style>
</head>
<body>

<div class="bg-glow"></div>

<div class="page">

  <!-- HEADER -->
  <header class="hdr">
    <div class="logo-area">
      <div class="logo-mark">
        <svg viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="2" width="6" height="6" rx="1.5" fill="#002726"/>
          <rect x="10" y="2" width="6" height="6" rx="1.5" fill="#002726"/>
          <rect x="2" y="10" width="6" height="6" rx="1.5" fill="#002726"/>
          <rect x="10" y="10" width="6" height="6" rx="1.5" fill="#002726" opacity=".4"/>
        </svg>
      </div>
      <span class="logo-name">Bling <span>Seletivo</span></span>
    </div>
    <span class="badge">Área restrita</span>
  </header>

  <!-- MAIN -->
  <main class="main">
    <div class="card">

      <div class="card-icon">🔐</div>
      <h1 class="card-title">Acesso de coordenador</h1>
      <p class="card-sub">Entre com suas credenciais para gerenciar processos seletivos.</p>

      <!-- ERRO -->
      <div class="err-box" id="err-box"></div>

      <!-- FORM -->
      <div class="fg">
        <label for="inp-email">E-mail corporativo</label>
        <input type="email" id="inp-email" placeholder="seu@bling.com.br" autocomplete="email">
      </div>

      <div class="fg">
        <label for="inp-senha">Senha</label>
        <input type="password" id="inp-senha" placeholder="••••••••" autocomplete="current-password"
               onkeydown="if(event.key==='Enter')entrar()">
      </div>

      <button class="btn-p" id="btn-entrar" onclick="entrar()">
        <span id="btn-txt">Entrar</span>
        <div class="spinner" id="spinner"></div>
      </button>

      <div class="divider"><span>acesso seguro</span></div>

      <div class="info-row">
        <div class="info-dot"></div>
        <span>Somente coordenadores cadastrados podem acessar</span>
      </div>

    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="footer-left">Bling Seletivo · Uso interno</span>
    <span class="footer-right">Plataforma de processos seletivos</span>
  </footer>

</div>

<!-- FIREBASE SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  // ── CONFIGURAÇÃO ── substitua pelos seus valores do Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyCxWXwMe3rE1zMSiIxmz5E34cc2BmyeGsw",
    authDomain: "bling-seletivo.firebaseapp.com",
    projectId: "bling-seletivo",
    storageBucket: "bling-seletivo.firebasestorage.app",
    messagingSenderId: "680949628238",
    appId: "1:680949628238:web:6e74791e02b69a1333321f"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // Se já estiver logado, redireciona direto para o painel
  onAuthStateChanged(auth, user => {
    if (user) {
      window.location.href = 'painel.html';
    }
  });

  // Expõe a função de login para o botão
  window.entrar = async function() {
    const email = document.getElementById('inp-email').value.trim();
    const senha = document.getElementById('inp-senha').value;
    const errBox = document.getElementById('err-box');
    const btn = document.getElementById('btn-entrar');
    const btnTxt = document.getElementById('btn-txt');
    const spinner = document.getElementById('spinner');

    // Validação básica
    errBox.style.display = 'none';
    if (!email || !senha) {
      errBox.textContent = 'Preencha e-mail e senha para continuar.';
      errBox.style.display = 'block';
      return;
    }

    // Loading
    btn.disabled = true;
    btnTxt.textContent = 'Entrando…';
    spinner.style.display = 'block';

    try {
      await signInWithEmailAndPassword(auth, email, senha);
      // onAuthStateChanged vai redirecionar automaticamente
    } catch (error) {
      btn.disabled = false;
      btnTxt.textContent = 'Entrar';
      spinner.style.display = 'none';

      // Mensagens de erro amigáveis
      const msgs = {
        'auth/invalid-credential':    'E-mail ou senha incorretos.',
        'auth/user-not-found':        'Nenhum coordenador encontrado com este e-mail.',
        'auth/wrong-password':        'Senha incorreta. Tente novamente.',
        'auth/invalid-email':         'E-mail inválido.',
        'auth/too-many-requests':     'Muitas tentativas. Aguarde alguns minutos e tente novamente.',
        'auth/network-request-failed':'Erro de conexão. Verifique sua internet.',
      };
      errBox.textContent = msgs[error.code] || 'Erro ao entrar. Tente novamente.';
      errBox.style.display = 'block';
    }
  };
</script>

</body>
</html>
